# 独立宿主机 nginx 配置；不能直接用于独立 bridge 网络中的 shared-gateway。
worker_processes auto;
events { worker_connections 1024; }
http {
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log warn;
    server {
        listen 80;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/yang-system/tls/fullchain.pem;
        ssl_certificate_key /etc/yang-system/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16m;
        location / {
            proxy_pass http://127.0.0.1:18654;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}

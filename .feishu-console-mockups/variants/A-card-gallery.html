<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飞书数据源控制台 · 方案 A 卡片画廊</title>
<meta name="description" content="一个数据源是一个有边界的「东西」，值得占一块地方。">
<style>
/* ============================================================================
   飞书数据源控制台 · 原型底座样式
   token 逐字抄自 frontend/src/index.css；组件配方对齐 shared/ui/*.tsx
   ========================================================================= */

:root {
  --radius: 0.625rem;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --secondary-foreground: oklch(0.205 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --accent-foreground: oklch(0.205 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --sidebar: oklch(0.985 0 0);
  --sidebar-foreground: oklch(0.145 0 0);
  --sidebar-accent: oklch(0.97 0 0);
  --sidebar-border: oklch(0.922 0 0);
  /* 语义色：引擎 CellPresentation.tone 词汇 */
  --tone-positive: oklch(0.52 0.13 155);
  --tone-warning: oklch(0.55 0.13 70);
  --tone-info: oklch(0.5 0.13 250);
  --density-cell-y: 0.625rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --sidebar: oklch(0.205 0 0);
    --sidebar-foreground: oklch(0.985 0 0);
    --sidebar-accent: oklch(0.269 0 0);
    --sidebar-border: oklch(1 0 0 / 10%);
    --tone-positive: oklch(0.78 0.15 155);
    --tone-warning: oklch(0.82 0.14 80);
    --tone-info: oklch(0.76 0.12 250);
  }
}

:root[data-theme="dark"] {
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --card-foreground: oklch(0.985 0 0);
  --popover: oklch(0.205 0 0);
  --popover-foreground: oklch(0.985 0 0);
  --primary: oklch(0.922 0 0);
  --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.269 0 0);
  --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0);
  --accent-foreground: oklch(0.985 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --border: oklch(1 0 0 / 10%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.556 0 0);
  --sidebar: oklch(0.205 0 0);
  --sidebar-foreground: oklch(0.985 0 0);
  --sidebar-accent: oklch(0.269 0 0);
  --sidebar-border: oklch(1 0 0 / 10%);
  --tone-positive: oklch(0.78 0.15 155);
  --tone-warning: oklch(0.82 0.14 80);
  --tone-info: oklch(0.76 0.12 250);
}

html[data-density="compact"] { --density-cell-y: 0.25rem; }
html[data-density="loose"]   { --density-cell-y: 1rem; }

/* ============================ 基础 ============================ */

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: none;
  border-color: var(--ring);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.i {
  width: 16px; height: 16px; flex-shrink: 0;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}
.i-sm { width: 14px; height: 14px; }

/* ============================ 外壳 ============================ */

.app {
  display: flex;
  height: calc(100svh - var(--ctl-h, 56px));
  overflow: hidden;
  background: var(--background);
  color: var(--foreground);
}

.sidebar {
  width: 240px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
  border-right: 1px solid var(--sidebar-border);
  background: var(--sidebar);
  color: var(--sidebar-foreground);
}

.brand {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.brand-mark {
  width: 32px; height: 32px; flex-shrink: 0;
  border-radius: 8px;
  background: var(--primary);
  color: var(--primary-foreground);
  display: grid; place-items: center;
  font-weight: 600; font-size: 15px;
}
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

.identity { padding: 8px; border-bottom: 1px solid var(--border); }
.identity-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px 8px; border: 0; border-radius: 8px;
  background: transparent; cursor: pointer; text-align: left;
}
.identity-btn:hover { background: var(--sidebar-accent); }
.identity-name { flex: 1; min-width: 0; font-size: 14px; }
.identity-role { font-size: 12px; color: var(--muted-foreground); }

.nav { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
.nav-label {
  padding: 0 8px 4px; font-size: 12px; font-weight: 500;
  color: var(--muted-foreground);
}
.nav ul { display: flex; flex-direction: column; gap: 2px; }
.navlink {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 8px;
  font-size: 14px; color: inherit; text-decoration: none;
  transition: background-color .12s, color .12s;
}
.navlink:hover { background: var(--sidebar-accent); color: var(--accent-foreground); }
.navlink[aria-current="page"] { background: var(--sidebar-accent); font-weight: 500; }

.sidebar-foot { border-top: 1px solid var(--border); padding: 12px; }

.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  padding: 8px 16px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar-left { margin-right: auto; display: flex; align-items: center; gap: 8px; }

main { flex: 1; min-width: 0; overflow-y: auto; }
.page { max-width: 1080px; margin: 0 auto; width: 100%; padding: 24px; }
.page-narrow { max-width: 720px; }

/* ============================ 按钮 ============================ */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 16px;
  border: 1px solid transparent; border-radius: 8px;
  font-size: 14px; font-weight: 500; white-space: nowrap;
  background: transparent; cursor: pointer;
  transition: background-color .12s, color .12s, border-color .12s;
}
.btn:disabled { pointer-events: none; opacity: .5; }
.btn svg { width: 16px; height: 16px; }

.btn-default { background: var(--primary); color: var(--primary-foreground); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); }
.btn-default:hover { background: color-mix(in oklab, var(--primary) 90%, transparent); }

.btn-outline { border-color: var(--border); background: var(--background); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); }
.btn-outline:hover { background: var(--accent); color: var(--accent-foreground); }

.btn-secondary { background: var(--secondary); color: var(--secondary-foreground); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); }
.btn-secondary:hover { background: color-mix(in oklab, var(--secondary) 80%, transparent); }

.btn-ghost:hover { background: var(--accent); color: var(--accent-foreground); }

.btn-destructive { background: var(--destructive); color: #fff; box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); }
.btn-destructive:hover { background: color-mix(in oklab, var(--destructive) 90%, transparent); }

.btn-link { height: auto; padding: 0; color: var(--primary); text-decoration: underline; text-underline-offset: 4px; }

.btn-sm { height: 32px; padding: 0 12px; border-radius: 8px; gap: 6px; }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; justify-content: flex-start; }

/* ============================ 徽标 ============================ */

.badge {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  width: fit-content; padding: 2px 8px;
  border: 1px solid; border-radius: 8px;
  font-size: 12px; font-weight: 500; line-height: 1.4; white-space: nowrap;
}
.badge svg { width: 12px; height: 12px; }

.tone-neutral  { color: var(--muted-foreground); border-color: color-mix(in oklab, var(--muted-foreground) 30%, transparent); background: color-mix(in oklab, var(--muted) 60%, transparent); }
.tone-positive { color: var(--tone-positive); border-color: color-mix(in oklab, var(--tone-positive) 35%, transparent); background: color-mix(in oklab, var(--tone-positive) 12%, transparent); }
.tone-warning  { color: var(--tone-warning);  border-color: color-mix(in oklab, var(--tone-warning) 35%, transparent);  background: color-mix(in oklab, var(--tone-warning) 12%, transparent); }
.tone-info     { color: var(--tone-info);     border-color: color-mix(in oklab, var(--tone-info) 35%, transparent);     background: color-mix(in oklab, var(--tone-info) 12%, transparent); }
.tone-negative { color: var(--destructive);   border-color: color-mix(in oklab, var(--destructive) 40%, transparent);   background: color-mix(in oklab, var(--destructive) 12%, transparent); }

:root[data-theme="dark"] .tone-positive,
:root[data-theme="dark"] .tone-warning,
:root[data-theme="dark"] .tone-info { background: color-mix(in oklab, currentColor 22%, transparent); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tone-positive,
  :root:not([data-theme="light"]) .tone-warning,
  :root:not([data-theme="light"]) .tone-info { background: color-mix(in oklab, currentColor 22%, transparent); }
}

.dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex-shrink: 0; }

/* ============================ 卡片 / 分节 ============================ */

.card {
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card);
  color: var(--card-foreground);
}

.section {
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card);
  color: var(--card-foreground);
  padding: 20px;
}
.section > h2 { font-size: 16px; font-weight: 500; line-height: 1.25; }
.section > .section-note { margin-top: 4px; font-size: 14px; color: var(--muted-foreground); }

/* ============================ 表单 ============================ */

.field { display: grid; gap: 6px; }
.field > label { font-size: 14px; font-weight: 500; line-height: 1; }
.field-hint { font-size: 12px; color: var(--muted-foreground); }
.field-error { font-size: 14px; color: var(--destructive); }

.input {
  width: 100%; height: 36px; padding: 0 12px;
  border: 1px solid var(--input); border-radius: 8px;
  background: transparent; font-size: 14px;
  transition: border-color .12s, box-shadow .12s;
}
.input[aria-invalid="true"] { border-color: var(--destructive); }
select.input { padding-right: 8px; }

/* ============================ 提示条 ============================ */

.banner {
  display: block; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--border);
  background: color-mix(in oklab, var(--muted) 50%, transparent);
  font-size: 14px;
}
.banner-error {
  border-color: color-mix(in oklab, var(--destructive) 40%, transparent);
  background: color-mix(in oklab, var(--destructive) 10%, transparent);
  color: var(--destructive);
}
.banner-danger {
  border-color: color-mix(in oklab, var(--destructive) 40%, transparent);
  background: color-mix(in oklab, var(--destructive) 5%, transparent);
  padding: 20px;
  border-radius: 14px;
}
.banner-danger > h2 { font-size: 16px; font-weight: 500; color: var(--destructive); }
.banner-row { display: flex; align-items: flex-start; gap: 8px; }
.banner-row > svg { margin-top: 2px; }

/* ============================ 列表行 ============================ */

.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 14px;
}
.row-sub { font-size: 12px; color: var(--muted-foreground); }

/* ============================ 下拉菜单 ============================ */

.menu-wrap { position: relative; display: inline-flex; }
.menu {
  position: absolute; top: calc(100% + 4px); right: 0; z-index: 60;
  min-width: 160px; padding: 4px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--popover); color: var(--popover-foreground);
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / .1), 0 2px 4px -2px rgb(0 0 0 / .1);
  display: flex; flex-direction: column;
}
.menu[hidden] { display: none; }
.menu-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border: 0; border-radius: 6px;
  background: transparent; font-size: 14px; text-align: left;
  cursor: pointer; width: 100%;
}
.menu-item:hover { background: var(--accent); color: var(--accent-foreground); }
.menu-item.is-danger { color: var(--destructive); }
.menu-item.is-danger:hover { background: color-mix(in oklab, var(--destructive) 10%, transparent); color: var(--destructive); }
.menu-sep { height: 1px; margin: 4px -4px; background: var(--border); }

/* ============================ 对话框 ============================ */

.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgb(0 0 0 / .5);
  display: grid; place-items: center;
  padding: 16px;
}
.overlay[hidden] { display: none; }
.dialog {
  width: 100%; max-width: 512px;
  max-height: calc(100svh - 64px); overflow-y: auto;
  padding: 24px;
  display: grid; gap: 16px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--background);
  box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  position: relative;
}
.dialog-title { font-size: 18px; font-weight: 600; line-height: 1.25; }
.dialog-desc { font-size: 14px; color: var(--muted-foreground); }
.dialog-close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px; padding: 0;
  border: 0; border-radius: 6px; background: transparent;
  display: grid; place-items: center; cursor: pointer; opacity: .7;
}
.dialog-close:hover { opacity: 1; background: var(--accent); }
.dialog-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ============================ 骨架 ============================ */

.skel { background: var(--accent); border-radius: 6px; animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

/* ============================ 空状态 ============================ */

.empty {
  border: 1px dashed var(--border); border-radius: 14px;
  padding: 40px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.empty-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  background: color-mix(in oklab, var(--muted) 70%, transparent);
  color: var(--muted-foreground); margin-bottom: 4px;
}
.empty-icon svg { width: 22px; height: 22px; }
.empty > h2 { font-size: 16px; font-weight: 500; }
.empty > p { font-size: 14px; color: var(--muted-foreground); max-width: 44ch; }
.empty-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

/* ============================ 指引 ============================ */

.guide {
  border: 1px solid var(--border); border-radius: 14px;
  background: color-mix(in oklab, var(--muted) 40%, transparent);
  overflow: hidden;
}
.guide-head {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 12px 16px; border: 0; background: transparent;
  cursor: pointer; text-align: left; font-size: 14px; font-weight: 500;
}
.guide-head:hover { background: color-mix(in oklab, var(--muted) 60%, transparent); }
.guide-head .guide-caret { margin-left: auto; transition: transform .16s; color: var(--muted-foreground); }
.guide[data-open="true"] .guide-caret { transform: rotate(180deg); }
.guide-body { padding: 0 16px 16px; }
.guide[data-open="false"] .guide-body { display: none; }
.guide-steps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.guide-step { display: flex; gap: 10px; }
.guide-num {
  width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px;
  background: var(--primary); color: var(--primary-foreground);
  display: grid; place-items: center; font-size: 12px; font-weight: 600;
}
.guide-step h3 { font-size: 14px; font-weight: 500; }
.guide-step p { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }

/* ============================ 页面头 / 详情头 ============================ */

.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
}
.page-title { font-size: 20px; font-weight: 600; line-height: 1.25; }
.page-sub { margin-top: 2px; font-size: 14px; color: var(--muted-foreground); }
.page-actions { display: flex; align-items: center; gap: 8px; }

.back-link { margin-bottom: 12px; padding-left: 0; }
.back-link:hover { background: transparent; text-decoration: underline; text-underline-offset: 4px; }

.detail-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
.detail-flags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ============================ 选项区（只读） ============================ */

.opt-wrap { border: 1px solid var(--border); border-radius: 14px; background: var(--card); overflow: hidden; }
.opt-head { display: flex; align-items: center; gap: 8px; padding: 16px 20px 0; }
.opt-title { font-size: 16px; font-weight: 500; }
.opt-head .badge { margin-left: auto; }
.opt-note {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 20px 0; font-size: 12px; color: var(--muted-foreground);
}
.opt-scroll { overflow-x: auto; padding: 12px 20px 16px; }
.opt-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.opt-table th {
  text-align: left; font-weight: 500; font-size: 12px;
  color: var(--muted-foreground);
  padding: 6px 12px 6px 0; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.opt-table td {
  padding: var(--density-cell-y) 12px var(--density-cell-y) 0;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.opt-table tbody tr:last-child td { border-bottom: 0; }
.opt-table th:last-child, .opt-table td:last-child { padding-right: 0; width: 1%; white-space: nowrap; }

/* ============================ 轻提示 ============================ */

.toast {
  position: fixed; left: 50%; bottom: calc(var(--ctl-h) + 16px); z-index: 300;
  transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--popover); color: var(--popover-foreground);
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / .1);
  font-size: 14px;
}

/* ============================ 原型控制条 ============================ */

:root { --ctl-h: 56px; }
.protoctl {
  position: fixed; left: 0; right: 0; bottom: 0; height: var(--ctl-h); z-index: 200;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 0 16px;
  border-top: 2px dashed color-mix(in oklab, var(--muted-foreground) 60%, transparent);
  background: color-mix(in oklab, var(--muted) 92%, var(--background));
  font-size: 12px;
}
.protoctl-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-weight: 600; letter-spacing: .02em;
  padding: 2px 8px; border-radius: 6px;
  border: 1px dashed color-mix(in oklab, var(--muted-foreground) 60%, transparent);
  color: var(--muted-foreground);
}
.protoctl-group { display: inline-flex; align-items: center; gap: 6px; }
.protoctl-group > span { color: var(--muted-foreground); }
.seg {
  display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; background: var(--background);
}
.seg > button {
  border: 0; background: transparent; cursor: pointer;
  padding: 4px 10px; font-size: 12px; color: var(--muted-foreground);
  border-right: 1px solid var(--border);
}
.seg > button:last-child { border-right: 0; }
.seg > button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); font-weight: 500; }
.protoctl-note { margin-left: auto; color: var(--muted-foreground); }
@media (max-width: 900px) { .protoctl-note { display: none; } }

/* ============================ 响应式 ============================ */

@media (max-width: 900px) {
  .sidebar { display: none; }
  .page { padding: 16px; }
  .topbar { padding: 8px 12px; }
  .topbar-left { display: flex; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* 方案 A · 卡片画廊 */

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin-top: 16px;
}

.tile {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card);
  color: var(--card-foreground);
  transition: border-color .12s, background-color .12s;
}
.tile:hover { background: color-mix(in oklab, var(--accent) 60%, var(--card)); }
.tile:focus-within { border-color: var(--ring); }

/* 整卡可点：铺满的透明按钮压在内容下面，菜单按钮浮在上面 */
.tile-hit {
  position: absolute;
  inset: 0;
  z-index: 0;
  padding: 0;
  border: 0;
  border-radius: inherit;
  background: transparent;
  cursor: pointer;
}
.tile-body {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  pointer-events: none;
}
.tile-body .menu-wrap { pointer-events: auto; }

.tile-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  min-height: 28px;
}
.tile-title { font-size: 14px; font-weight: 500; line-height: 1.4; }

.tile-key {
  font-size: 12px;
  color: var(--muted-foreground);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tile-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.tile-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted-foreground);
}
.tile-sep { opacity: .6; }

.tile-hint {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--muted-foreground);
  opacity: 0;
  transition: opacity .12s;
}
.tile:hover .tile-hint { opacity: 1; }

/* 卡片里的 ⋯ 比详情页的小一号 */
.menu-btn-sm { width: 28px; height: 28px; }
.menu-btn-sm svg { width: 16px; height: 16px; }
</style>

  list: function () {

    "</div>" +
    (canWrite ? "" : '<div class="tile-hint">查看选项' + icon("chevron-right", "i-sm") + "</div>") +
    "</div></article>";
}

function noMatch() {
  return '<div class="empty">' +
    '<span class="empty-icon">' + icon("search") + "</span>" +
    "<h2>没有匹配的数据源</h2>" +

};

const read = {
  canWrite: function () { return STATE.role === "ops"; },
  canRead: function () { return true; },
  canReadOptions: function () { return true; },
  all: function () { return DATASOURCES; },
  filtered: function () {
    const q = STATE.query.q.trim().toLowerCase();
    return DATASOURCES.filter(function (ds) {
      if (STATE.query.status !== "all" && ds.status !== STATE.query.status) return false;
      if (!q) return true;
      return ds.title.toLowerCase().indexOf(q) >= 0 || ds.source_key.toLowerCase().indexOf(q) >= 0;
    });
  },
  byKey: function (key) {
    for (let i = 0; i < DATASOURCES.length; i += 1) {
      if (DATASOURCES[i].source_key === key) return DATASOURCES[i];
    }
    return null;
  },
  selected: function () {
    return STATE.route.key ? read.byKey(STATE.route.key) : null;
  },
  options: function (key) { return optionsFor(key); },
  activeCount: function () {
    return DATASOURCES.filter(function (ds) { return ds.status === "active"; }).length;
  },
};

/* -------------------------------- 小工具 --------------------------------- */

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function statusLabel(ds) { return ds.status === "active" ? "启用" : "已停用"; }
function statusTone(ds) { return ds.status === "active" ? "positive" : "warning"; }

function statusBadge(ds) {
  return '<span class="badge tone-' + statusTone(ds) + '"><i class="dot"></i>' +
    statusLabel(ds) + "</span>";
}

function encryptFlag(ds) {
  return ds.encrypt_enabled
    ? '<span class="badge tone-info">' + icon("lock") + "加密</span>"
    : '<span class="badge tone-neutral">未加密</span>';
}

function toast(message) {
  STATE.toast = message;
  render();
  window.setTimeout(function () {
    if (STATE.toast === message) { STATE.toast = ""; render(); }
  }, 2400);
}

  const steps = GUIDE_STEPS.map(function (step, index) {
    return '<div class="guide-step"><span class="guide-num num">' + (index + 1) + "</span>" +
      "<div><h3>" + step[0] + "</h3><p>" + step[1] + "</p></div></div>";
  }).join("");
  return '<section class="guide" data-open="' + open + '">' +
    '<button type="button" class="guide-head" data-act="toggle-guide">' +
    icon("circle-help", "i-sm") +
    "<span>从飞书审批后台到多维表格，四步接起来</span>" +
    '<span class="guide-caret">' + icon("chevron-down", "i-sm") + "</span>" +
    "</button>" +

/* --------------------------------- 渲染 ---------------------------------- */

/// 重绘会换掉整棵 DOM，所以先记住焦点位置，重绘后放回去。
function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.getAttribute) return null;
  const id = el.getAttribute("data-focus-id");
  if (!id) return null;
  let start = null;
  let end = null;
  try { start = el.selectionStart; end = el.selectionEnd; } catch (error) { start = null; }
  return { id: id, start: start, end: end };
}

function restoreFocus(snapshot) {
  if (!snapshot) return;
  const el = document.querySelector('[data-focus-id="' + snapshot.id + '"]');
  if (!el) return;
  el.focus();
  if (snapshot.start != null && el.setSelectionRange) {
    try { el.setSelectionRange(snapshot.start, snapshot.end); } catch (error) { /* 非文本控件 */ }
  }
}

function render() {
  const focus = captureFocus();

  if (STATE.theme === "dark" || STATE.theme === "light") {
    document.documentElement.setAttribute("data-theme", STATE.theme);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  if (STATE.density === "standard") document.documentElement.removeAttribute("data-density");
  else document.documentElement.setAttribute("data-density", STATE.density);

  const root = document.getElementById("root");
  root.innerHTML = '<div class="app">' + shellHtml() + "</div>" +
    '<div id="dialog-root">' + dialogHtml() + "</div>" +
    (STATE.toast ? '<div class="toast" role="status">' + icon("circle-check", "i-sm") + esc(STATE.toast) + "</div>" : "") +
    controlBarHtml();

  document.getElementById("main").innerHTML = mainHtml();
  restoreFocus(focus);
}

/* -------------------------------- 交互 ---------------------------------- */

function setRoute(name, key) {
  STATE.route = { name: name, key: key || null };
  STATE.menuFor = null;
  const hash = name === "detail" ? "#/d/" + key : "#/";
  if (window.location.hash !== hash) window.location.hash = hash;
  render();
}

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, "");
  if (raw.indexOf("d/") === 0) {
    const key = decodeURIComponent(raw.slice(2));
    if (read.byKey(key)) { STATE.route = { name: "detail", key: key }; return; }
  }
  STATE.route = { name: "list", key: null };
}

/// 读取当前生效的字段：对话框优先，其次是主区里的内联表单（方案 D 的向导第 2 步）。
function readForm() {
  const form = { source_key: "", title: "", token: "", default_locale: "zh-CN" };
  const scope = document.querySelector("#dialog-root [data-field]") ? "#dialog-root" : "#main";
  const nodes = document.querySelectorAll(scope + " [data-field]");
  for (let i = 0; i < nodes.length; i += 1) {
    form[nodes[i].getAttribute("data-field")] = nodes[i].value;
  }
  return form;
}

/// 提交成功返回 true，校验失败返回 false（错误写进 STATE.formError）。
function submitForm(kind) {
  const form = readForm();
  STATE.formError = "";

  if (kind === "add") {
    if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(form.source_key)) {
      STATE.formError = "数据源标识只能用小写字母、数字与连字符，且以字母或数字开头。";
      render(); return false;
    }
    if (read.byKey(form.source_key)) {
      STATE.formError = "这个数据源标识已经被占用了。";
      render(); return false;
    }
  }
  if (kind === "rename") {
    const ds = read.byKey(STATE.dialog.key);
    if (!ds) { STATE.dialog = null; render(); return false; }
    if (!form.title.trim() || form.title.trim().length > 100) {
      STATE.formError = "title 长度必须在 1..=100";
      render(); return false;
    }
    ds.title = form.title.trim();
    STATE.dialog = null;
    toast("已重命名");
    return true;
  }
  if (!form.title.trim() || form.title.trim().length > 100) {
    STATE.formError = "title 长度必须在 1..=100";
    render(); return false;
  }
  if (!form.token) {
    STATE.formError = "Token 不能为空；不轮换请省略该字段";
    render(); return false;
  }
  DATASOURCES.unshift({
    source_key: form.source_key, title: form.title.trim(), status: "active",
    encrypt_enabled: false, default_locale: form.default_locale,
    option_count: 0, updated_at: "刚刚",
  });
  OPTIONS_BY_KEY[form.source_key] = [];
  STATE.dialog = null;
  toast("已创建");
  return true;
}

/// 搜索框等「边打边筛」控件：只重绘 #results 区域，输入焦点与光标不丢。
document.addEventListener("input", function (event) {
  const el = event.target;
  if (!el || !el.getAttribute) return;
  const live = el.getAttribute("data-live");
  if (!live) return;
  if (live === "q") STATE.query.q = el.value;
  if (LAYOUT.onLive) LAYOUT.onLive(live, el.value);
  const region = document.getElementById("results");
  if (region && LAYOUT.results) region.innerHTML = LAYOUT.results();
});

document.addEventListener("click", function (event) {
  const trigger = event.target.closest ? event.target.closest("[data-act]") : null;
  if (!trigger) {
    if (STATE.menuFor) { STATE.menuFor = null; render(); }
    return;
  }
  const act = trigger.getAttribute("data-act");
  const key = trigger.getAttribute("data-key");

  if (act === "overlay") {
    if (event.target === trigger) { STATE.dialog = null; STATE.formError = ""; render(); }
    return;
  }
  if (act === "noop") { event.preventDefault(); return; }

  switch (act) {
    case "set": {
      const name = trigger.getAttribute("data-name");
      const value = trigger.getAttribute("data-value");
      if (name === "theme") STATE.theme = value;
      else STATE[name] = value;
      if (name === "role" && STATE.role === "biz") STATE.menuFor = null;
      if (name === "dataState" && value === "empty") STATE.route = { name: "list", key: null };
      if (name === "dataState" && value === "data") STATE.guideOpen = false;
      render();
      return;
    }
    case "toggle-theme":
      STATE.theme = isDark() ? "light" : "dark";
      render();
      return;
    case "go-list":
      event.preventDefault();
      setRoute("list", null);
      return;
    case "toggle-guide":
      STATE.guideOpen = !STATE.guideOpen;
      render();
      return;
    case "retry":
      STATE.dataState = "data";
      render();
      return;
    case "toggle-menu": {
      event.stopPropagation();
      STATE.menuFor = STATE.menuFor === key ? null : key;
      render();
      return;
    }
    case "open-add":
      STATE.dialog = { kind: "add" };
      STATE.formError = "";
      render();
      return;
    case "open-rename":
      STATE.dialog = { kind: "rename", key: key };
      STATE.formError = "";
      STATE.menuFor = null;
      render();
      return;
    case "open-delete":
      STATE.dialog = { kind: "delete", key: key };
      STATE.menuFor = null;
      render();
      return;
    case "close-dialog":
      STATE.dialog = null;
      STATE.formError = "";
      render();
      return;
    case "submit-add":
      submitForm("add");
      return;
    case "submit-rename":
      submitForm("rename");
      return;
    case "confirm-delete": {
      const ds = read.byKey(key || (STATE.dialog && STATE.dialog.key));
      if (ds) {
        const at = DATASOURCES.indexOf(ds);
        if (at >= 0) DATASOURCES.splice(at, 1);
        delete OPTIONS_BY_KEY[ds.source_key];
      }
      STATE.dialog = null;
      if (STATE.route.key === (ds && ds.source_key)) STATE.route = { name: "list", key: null };
      toast("已删除");
      if (DATASOURCES.length === 0) STATE.dataState = "empty";
      render();
      return;
    }
    case "toggle-status": {
      const ds = read.byKey(key);
      if (ds) {
        ds.status = ds.status === "active" ? "disabled" : "active";
        toast(ds.status === "active" ? "已启用" : "已停用");
      }
      STATE.menuFor = null;
      return;
    }
    case "open-detail":
      setRoute("detail", key);
      return;
    case "set-density":
      STATE.density = trigger.getAttribute("data-value");
      STATE.menuFor = null;
      render();
      return;
    case "filter-status":
      STATE.query.status = trigger.getAttribute("data-value");
      render();
      return;
    case "select-ds":
      // 分栏布局里选中即就地换右栏，不切路由（窄屏时由 CSS 决定是否整屏显示）。
      STATE.route = LAYOUT.split ? { name: "list", key: key } : { name: "detail", key: key };
      STATE.menuFor = null;
      render();
      return;
    case "clear-selection":
      STATE.route = { name: "list", key: null };
      render();
      return;
    case "back":
      setRoute("list", null);
      return;
    default:
      if (LAYOUT.onAction) LAYOUT.onAction(act, key, trigger, event);
  }
});

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    if (STATE.dialog) { STATE.dialog = null; STATE.formError = ""; render(); return; }
    if (STATE.menuFor) { STATE.menuFor = null; render(); return; }
    return;
  }
  // 让整行/整卡可点：把 Enter 转发成一次 click（表单控件自身不拦）。
  if (event.key !== "Enter") return;
  const tag = event.target && event.target.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  const hit = event.target.closest ? event.target.closest("[data-act]") : null;
  if (!hit) return;
  event.preventDefault();
  hit.click();
});

window.addEventListener("hashchange", function () {
  parseHash();
  render();
});

/* --------------------------------- 启动 ---------------------------------- */

parseHash();
STATE.guideOpen = STATE.dataState === "empty";
render();
</script>
</body>
</html>

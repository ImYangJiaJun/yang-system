<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飞书数据源 · 方案 B 紧凑目录</title>
<style>
:root{
  --radius:0.625rem;
  --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:14px;
  --background:oklch(1 0 0);
  --foreground:oklch(0.145 0 0);
  --card:oklch(1 0 0);
  --card-foreground:oklch(0.145 0 0);
  --popover:oklch(1 0 0);
  --popover-foreground:oklch(0.145 0 0);
  --primary:oklch(0.205 0 0);
  --primary-foreground:oklch(0.985 0 0);
  --secondary:oklch(0.97 0 0);
  --secondary-foreground:oklch(0.205 0 0);
  --muted:oklch(0.97 0 0);
  --muted-foreground:oklch(0.556 0 0);
  --accent:oklch(0.97 0 0);
  --accent-foreground:oklch(0.205 0 0);
  --destructive:oklch(0.577 0.245 27.325);
  --border:oklch(0.922 0 0);
  --input:oklch(0.922 0 0);
  --ring:oklch(0.708 0 0);
  --sidebar:oklch(0.985 0 0);
  --sidebar-foreground:oklch(0.145 0 0);
  --sidebar-accent:oklch(0.97 0 0);
  --sidebar-border:oklch(0.922 0 0);
  --density-cell-y:0.625rem;
  --tone-positive:oklch(0.52 0.13 155);
  --tone-warning:oklch(0.52 0.12 65);
  --tone-info:oklch(0.52 0.14 250);
  --tone-mix:12%;
}
.dark, :root[data-theme="dark"]{
  --background:oklch(0.145 0 0);
  --foreground:oklch(0.985 0 0);
  --card:oklch(0.205 0 0);
  --card-foreground:oklch(0.985 0 0);
  --popover:oklch(0.205 0 0);
  --popover-foreground:oklch(0.985 0 0);
  --primary:oklch(0.922 0 0);
  --primary-foreground:oklch(0.205 0 0);
  --secondary:oklch(0.269 0 0);
  --secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.269 0 0);
  --muted-foreground:oklch(0.708 0 0);
  --accent:oklch(0.269 0 0);
  --accent-foreground:oklch(0.985 0 0);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);
  --input:oklch(1 0 0 / 15%);
  --ring:oklch(0.556 0 0);
  --sidebar:oklch(0.205 0 0);
  --sidebar-foreground:oklch(0.985 0 0);
  --sidebar-accent:oklch(0.269 0 0);
  --sidebar-border:oklch(1 0 0 / 10%);
  --tone-positive:oklch(0.78 0.15 155);
  --tone-warning:oklch(0.8 0.14 75);
  --tone-info:oklch(0.76 0.12 250);
  --tone-mix:22%;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --background:oklch(0.145 0 0);
    --foreground:oklch(0.985 0 0);
    --card:oklch(0.205 0 0);
    --card-foreground:oklch(0.985 0 0);
    --popover:oklch(0.205 0 0);
    --popover-foreground:oklch(0.985 0 0);
    --primary:oklch(0.922 0 0);
    --primary-foreground:oklch(0.205 0 0);
    --secondary:oklch(0.269 0 0);
    --secondary-foreground:oklch(0.985 0 0);
    --muted:oklch(0.269 0 0);
    --muted-foreground:oklch(0.708 0 0);
    --accent:oklch(0.269 0 0);
    --accent-foreground:oklch(0.985 0 0);
    --destructive:oklch(0.704 0.191 22.216);
    --border:oklch(1 0 0 / 10%);
    --input:oklch(1 0 0 / 15%);
    --ring:oklch(0.556 0 0);
    --sidebar:oklch(0.205 0 0);
    --sidebar-foreground:oklch(0.985 0 0);
    --sidebar-accent:oklch(0.269 0 0);
    --sidebar-border:oklch(1 0 0 / 10%);
    --tone-positive:oklch(0.78 0.15 155);
    --tone-warning:oklch(0.8 0.14 75);
    --tone-info:oklch(0.76 0.12 250);
    --tone-mix:22%;
  }
}
html[data-density="compact"]{ --density-cell-y:0.25rem; }
html[data-density="loose"]{ --density-cell-y:1rem; }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--background);
  color:var(--foreground);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ margin:0; line-height:1.25; }
p{ margin:0; }
ol,ul{ margin:0; padding:0; list-style:none; }
button{ font:inherit; color:inherit; }
a{ color:inherit; }
.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
.tnum{ font-variant-numeric:tabular-nums; }
.sprite{ position:absolute; width:0; height:0; overflow:hidden; }
.i{ width:16px; height:16px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.i-14{ width:14px; height:14px; }
:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }

.shell{ display:flex; height:100svh; overflow:hidden; }
.sidebar{
  width:240px; flex:0 0 240px; display:flex; flex-direction:column;
  border-right:1px solid var(--border); background:var(--sidebar); color:var(--sidebar-foreground);
}
.brand{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); padding:12px 16px; }
.brand-logo{ width:40px; height:40px; flex:0 0 40px; border-radius:var(--radius-md); background:var(--primary); color:var(--primary-foreground); display:grid; place-items:center; }
.brand-logo .i{ width:20px; height:20px; }
.brand-name{ font-size:14px; font-weight:600; letter-spacing:-.01em; }
.identity{ border-bottom:1px solid var(--border); padding:8px; }
.identity-btn{ display:flex; width:100%; align-items:center; gap:8px; border:0; border-radius:var(--radius-md); background:none; padding:6px 8px; font-size:14px; cursor:pointer; text-align:left; }
.identity-btn:hover{ background:var(--accent); color:var(--accent-foreground); }
.avatar{ width:24px; height:24px; flex:0 0 24px; border-radius:999px; display:grid; place-items:center; background:var(--secondary); color:var(--secondary-foreground); font-size:11px; font-weight:600; }
.identity-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:16px; }
.nav-group-label{ padding:0 8px 4px; font-size:12px; font-weight:500; color:var(--muted-foreground); }
.nav-list{ display:flex; flex-direction:column; gap:2px; }
.nav-item{ display:flex; align-items:center; gap:8px; border-radius:var(--radius-md); padding:6px 8px; font-size:14px; text-decoration:none; color:inherit; transition:background-color .15s ease, color .15s ease; }
.nav-item:hover{ background:var(--accent); color:var(--accent-foreground); }
.nav-item[aria-current="page"]{ background:var(--accent); color:var(--accent-foreground); font-weight:500; }
.sidebar-foot{ border-top:1px solid var(--border); padding:12px; }
.content{ display:flex; flex:1; min-width:0; flex-direction:column; }
.topbar{ display:flex; align-items:center; justify-content:flex-end; gap:8px; border-bottom:1px solid var(--border); padding:8px 16px; }
main.page{ flex:1; min-width:0; min-height:0; overflow-y:auto; padding:24px; padding-bottom:88px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; border-radius:var(--radius-md); font-size:14px; font-weight:500; border:1px solid transparent; background:none; cursor:pointer; transition:background-color .15s ease, color .15s ease, border-color .15s ease; height:36px; padding:0 16px; }
.btn[disabled]{ pointer-events:none; opacity:.5; }
.btn-default{ background:var(--primary); color:var(--primary-foreground); box-shadow:0 1px 2px 0 rgb(0 0 0/.05); }
.btn-default:hover{ background:color-mix(in oklab, var(--primary) 90%, transparent); }
.btn-outline{ border-color:var(--border); background:var(--background); box-shadow:0 1px 2px 0 rgb(0 0 0/.05); }
.btn-outline:hover{ background:var(--accent); color:var(--accent-foreground); }
.btn-ghost:hover{ background:var(--accent); color:var(--accent-foreground); }
.btn-destructive{ background:var(--destructive); color:#fff; box-shadow:0 1px 2px 0 rgb(0 0 0/.05); }
.btn-destructive:hover{ background:color-mix(in oklab, var(--destructive) 90%, transparent); }
.btn-sm{ height:32px; padding:0 12px; gap:6px; }
.btn-block{ width:100%; justify-content:flex-start; }
.icon-btn{ width:36px; height:36px; display:inline-grid; place-items:center; border-radius:var(--radius-md); border:1px solid transparent; background:none; cursor:pointer; }
.icon-btn:hover{ background:var(--accent); color:var(--accent-foreground); }
.icon-btn-sm{ width:28px; height:28px; }

.tone{ display:inline-flex; align-items:center; justify-content:center; gap:4px; border-radius:var(--radius-md); border:1px solid transparent; padding:2px 8px; font-size:12px; font-weight:500; white-space:nowrap; width:fit-content; }
.tone-positive{ color:var(--tone-positive); border-color:color-mix(in oklab, var(--tone-positive) 30%, transparent); background:color-mix(in oklab, var(--tone-positive) var(--tone-mix), transparent); }
.tone-warning{ color:var(--tone-warning); border-color:color-mix(in oklab, var(--tone-warning) 30%, transparent); background:color-mix(in oklab, var(--tone-warning) var(--tone-mix), transparent); }
.tone-info{ color:var(--tone-info); border-color:color-mix(in oklab, var(--tone-info) 30%, transparent); background:color-mix(in oklab, var(--tone-info) var(--tone-mix), transparent); }
.tone-neutral{ color:var(--muted-foreground); border-color:var(--border); background:color-mix(in oklab, var(--muted) 60%, transparent); }

.alert-error, .alert-neutral{ display:block; border-radius:var(--radius-md); padding:8px 12px; font-size:14px; }
.alert-error{ border:1px solid color-mix(in oklab, var(--destructive) 40%, transparent); background:color-mix(in oklab, var(--destructive) 10%, transparent); color:var(--destructive); }
.alert-neutral{ border:1px solid var(--border); background:color-mix(in oklab, var(--muted) 50%, transparent); }

.page-head{ display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:24px; }
.page-head h1{ font-size:20px; font-weight:600; }
.page-sub{ margin-top:4px; font-size:14px; color:var(--muted-foreground); }
.head-actions{ display:flex; align-items:center; gap:8px; }
.back{ display:inline-flex; align-items:center; gap:6px; font-size:14px; color:var(--muted-foreground); text-decoration:none; background:none; border:0; padding:0; cursor:pointer; margin-bottom:8px; }
.back:hover{ color:var(--foreground); }

.toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px; }
.search{ position:relative; flex:1 1 220px; max-width:320px; }
.search .i{ position:absolute; left:12px; top:10px; color:var(--muted-foreground); }
.search input{ padding-left:36px; }
.toolbar-spacer{ flex:1; }
.disclosure{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--background); padding:0 10px; height:32px; font-size:13px; color:var(--muted-foreground); cursor:pointer; }
.disclosure:hover{ background:var(--accent); color:var(--accent-foreground); }
.disclosure[aria-expanded="true"] .i{ transform:rotate(90deg); }

.guide{ border:1px solid var(--border); border-radius:var(--radius-xl); background:var(--card); margin-bottom:16px; }
.guide-steps{ display:grid; gap:2px; padding:4px 16px 16px; }
.guide-step{ display:flex; gap:12px; padding:10px 0; }
.guide-step + .guide-step{ border-top:1px solid color-mix(in oklab, var(--border) 60%, transparent); }
.guide-num{ width:22px; height:22px; flex:0 0 22px; border-radius:999px; display:grid; place-items:center; border:1px solid var(--border); background:var(--secondary); color:var(--secondary-foreground); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
.guide-step strong{ display:block; font-size:14px; font-weight:500; }
.guide-step p{ margin-top:2px; font-size:13px; color:var(--muted-foreground); }
.guide-warn{ display:flex; gap:8px; margin:0 16px 16px; border-radius:var(--radius-md); border:1px solid color-mix(in oklab, var(--tone-warning) 35%, transparent); background:color-mix(in oklab, var(--tone-warning) var(--tone-mix), transparent); padding:8px 12px; font-size:13px; color:var(--tone-warning); }

.table-wrap{ border:1px solid var(--border); border-radius:var(--radius-xl); background:var(--card); overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:14px; }
thead th{ position:sticky; top:0; z-index:1; text-align:left; font-weight:500; font-size:12px; color:var(--muted-foreground); background:var(--card); padding:calc(var(--density-cell-y) + 2px) 16px; border-bottom:1px solid var(--border); white-space:nowrap; }
tbody td{ padding:var(--density-cell-y) 16px; border-bottom:1px solid color-mix(in oklab, var(--border) 70%, transparent); vertical-align:middle; }
tbody tr:last-child td{ border-bottom:0; }
tbody tr[data-act]{ cursor:pointer; }
tbody tr[data-act]:hover{ background:var(--accent); }
tbody tr[data-off="true"] td{ color:var(--muted-foreground); }
td.numeric, th.numeric{ font-variant-numeric:tabular-nums; }
td.cell-action{ position:relative; width:48px; padding-right:8px; }
.row-actions{ opacity:0; transition:opacity .15s ease; }
tr:hover .row-actions, tr:focus-within .row-actions{ opacity:1; }
.table-foot{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid var(--border); padding:8px calc(var(--density-cell-y) + 8px); font-size:12px; color:var(--muted-foreground); }
.pager{ display:flex; align-items:center; gap:8px; }

.menu{ position:absolute; right:8px; top:calc(100% - 4px); z-index:20; min-width:168px; padding:4px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--popover); color:var(--popover-foreground); box-shadow:0 10px 15px -3px rgb(0 0 0/.1), 0 4px 6px -4px rgb(0 0 0/.1); }
.menu button{ display:flex; width:100%; align-items:center; gap:8px; border:0; border-radius:var(--radius-sm); background:none; padding:6px 8px; font-size:14px; text-align:left; cursor:pointer; }
.menu button:hover:not([disabled]){ background:var(--accent); color:var(--accent-foreground); }
.menu button[disabled]{ opacity:.5; cursor:not-allowed; }
.menu .menu-danger{ color:var(--destructive); }
.menu-sep{ height:1px; margin:4px 0; background:var(--border); }
.menu-above{ top:auto; bottom:calc(100% - 4px); }

.empty{ display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; border:1px dashed var(--border); border-radius:var(--radius-xl); padding:48px 24px; background:var(--card); }
.empty-icon{ width:44px; height:44px; border-radius:999px; display:grid; place-items:center; background:var(--secondary); color:var(--muted-foreground); }
.empty-icon .i{ width:20px; height:20px; }
.empty h2{ font-size:16px; font-weight:600; }
.empty p{ max-width:420px; font-size:14px; color:var(--muted-foreground); }
.empty-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }

.skeleton{ background:var(--muted); border-radius:var(--radius-sm); animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
@keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.5 } }
.skeleton-rows{ display:grid; gap:2px; padding:12px 16px; }

.notice{ display:flex; align-items:center; gap:8px; margin-bottom:16px; border:1px solid var(--border); background:color-mix(in oklab, var(--muted) 50%, transparent); border-radius:var(--radius-md); padding:8px 12px; font-size:14px; color:var(--muted-foreground); }

.overlay{ position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgb(0 0 0/.5); padding:16px; animation:fade .2s ease; }
.dialog{ position:relative; width:100%; max-width:512px; display:grid; gap:16px; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--background); padding:24px; box-shadow:0 10px 15px -3px rgb(0 0 0/.1), 0 4px 6px -4px rgb(0 0 0/.1); max-height:calc(100svh - 32px); overflow-y:auto; animation:zoomin .2s ease; }
.dialog-x{ position:absolute; top:16px; right:16px; border:0; background:none; padding:0; width:16px; height:16px; opacity:.7; cursor:pointer; }
.dialog-x:hover{ opacity:1; }
.dialog-head{ display:grid; gap:8px; }
.dialog-head h2{ font-size:18px; font-weight:600; }
.dialog-head p{ font-size:14px; color:var(--muted-foreground); }
.dialog-body{ display:grid; gap:12px; }
.dialog-foot{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
.dialog-key{ font-size:13px; color:var(--muted-foreground); }
@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
@keyframes zoomin{ from{ opacity:0; transform:scale(.95) } to{ opacity:1; transform:scale(1) } }

.field{ display:grid; gap:6px; }
.field label{ font-size:14px; font-weight:500; line-height:1; }
.field .hint{ font-size:12px; color:var(--muted-foreground); }
.field .err{ font-size:14px; color:var(--destructive); }
input[type=text], input[type=password], select{ height:36px; width:100%; border:1px solid var(--input); border-radius:var(--radius-md); background:transparent; padding:0 12px; font-size:14px; color:inherit; font-family:inherit; }
input:focus, select:focus{ outline:none; border-color:var(--ring); box-shadow:0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent); }
input[aria-invalid="true"]{ border-color:var(--destructive); }
.input-group{ display:flex; gap:8px; }
.input-group > input{ flex:1; min-width:0; }
.check{ display:flex; align-items:flex-start; gap:8px; font-size:14px; }
.check input{ margin:3px 0 0; width:16px; height:16px; accent-color:var(--primary); }
.check-text strong{ font-weight:500; display:block; }
.check-text span{ font-size:12px; color:var(--muted-foreground); }

.proto-bar{ position:fixed; left:50%; bottom:16px; z-index:60; transform:translateX(-50%); display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 12px; max-width:calc(100vw - 32px); padding:8px 12px; border:1px dashed color-mix(in oklab, var(--foreground) 35%, transparent); border-radius:var(--radius-md); background:color-mix(in oklab, var(--muted) 92%, var(--background)); box-shadow:0 4px 6px -4px rgb(0 0 0/.1); }
.proto-label{ font-size:12px; font-weight:600; color:var(--muted-foreground); white-space:nowrap; }
.proto-group{ display:flex; align-items:center; gap:4px; }
.proto-group > span{ font-size:12px; color:var(--muted-foreground); }
.seg{ display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:var(--background); }
.seg button{ border:0; background:none; padding:4px 10px; font-size:12px; cursor:pointer; }
.seg button + button{ border-left:1px solid var(--border); }
.seg button[aria-pressed="true"]{ background:var(--primary); color:var(--primary-foreground); }

@media (max-width:900px){
  .sidebar{ width:56px; flex-basis:56px; }
  .brand{ padding:12px 8px; justify-content:center; }
  .brand-name, .identity-name, .nav-group-label, .nav-item span{ display:none; }
  .identity-btn{ justify-content:center; padding:6px; }
  .nav{ padding:8px; align-items:center; }
  .nav-item{ justify-content:center; padding:8px; }
  .sidebar-foot .btn{ justify-content:center; padding:0 8px; }
  .sidebar-foot .btn span{ display:none; }
  main.page{ padding:16px; padding-bottom:96px; }
  .search{ max-width:none; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  var ROLES = {
    ops: { name: "集成运维 · 李工", initial: "李" },
    biz: { name: "审批管理员 · 王敏", initial: "王" }
  };

  var SOURCES = [
    { key: "expense-category", title: "报销事由分类", status: "active", encrypt: true, locale: "zh-CN" },
    { key: "leave-type", title: "请假类型", status: "active", encrypt: false, locale: "zh-CN" },
    { key: "purchase-dept", title: "采购归口部门", status: "active", encrypt: true, locale: "zh-CN" },
    { key: "vendor-list", title: "供应商名录", status: "disabled", encrypt: false, locale: "zh-CN" },
    { key: "it-asset-class", title: "IT 资产分类", status: "active", encrypt: false, locale: "en-US" },
    { key: "travel-city", title: "差旅城市", status: "active", encrypt: false, locale: "zh-CN" },
    { key: "contract-type", title: "合同类型", status: "disabled", encrypt: false, locale: "zh-CN" },
    { key: "cost-center", title: "成本中心", status: "active", encrypt: true, locale: "zh-CN" }
  ];

  // [option_id, label, sort_order, enabled, is_default]
  var OPTIONS = {
    "expense-category": [
      ["expense-travel", "差旅费", 10, 1, 1], ["office-supplies", "办公用品", 20, 1, 0],
      ["business-entertain", "业务招待", 30, 1, 0], ["training", "培训费", 40, 1, 0],
      ["telecom", "通讯费", 50, 0, 0], ["rent-utilities", "房租水电", 60, 1, 0],
      ["consulting", "咨询服务费", 70, 1, 0], ["other", "其他", 999, 1, 0]
    ],
    "leave-type": [
      ["personal-leave", "事假", 10, 1, 0], ["sick-leave", "病假", 20, 1, 0],
      ["annual-leave", "年假", 30, 1, 1], ["comp-leave", "调休", 40, 1, 0],
      ["marriage-leave", "婚假", 50, 1, 0], ["maternity-leave", "产假", 60, 1, 0],
      ["paternity-leave", "陪产假", 70, 0, 0]
    ],
    "purchase-dept": [
      ["dept-admin", "行政部", 10, 1, 0], ["dept-tech", "技术部", 20, 1, 0],
      ["dept-marketing", "市场部", 30, 1, 1], ["dept-finance", "财务部", 40, 1, 0],
      ["dept-hr", "人力资源部", 50, 1, 0]
    ],
    "vendor-list": [
      ["vendor-east", "华东供应商", 10, 1, 0], ["vendor-south", "华南供应商", 20, 1, 0],
      ["vendor-north", "华北供应商", 30, 0, 0]
    ],
    "it-asset-class": [
      ["asset-laptop", "Laptop", 10, 1, 1], ["asset-monitor", "Monitor", 20, 1, 0],
      ["asset-phone", "Phone", 30, 1, 0], ["asset-peripheral", "Peripheral", 40, 1, 0],
      ["asset-license", "Software License", 50, 1, 0]
    ],
    "travel-city": [
      ["city-beijing", "北京", 10, 1, 1], ["city-shanghai", "上海", 20, 1, 0],
      ["city-guangzhou", "广州", 30, 1, 0], ["city-shenzhen", "深圳", 40, 1, 0],
      ["city-chengdu", "成都", 50, 1, 0], ["city-hangzhou", "杭州", 60, 1, 0]
    ],
    "contract-type": [
      ["contract-purchase", "采购合同", 10, 1, 0], ["contract-service", "服务合同", 20, 1, 0],
      ["contract-lease", "租赁合同", 30, 1, 0], ["contract-nda", "保密协议", 40, 1, 0]
    ],
    "cost-center": [
      ["cc-1001", "CC-1001 研发中心", 10, 1, 1], ["cc-2001", "CC-2001 市场中心", 20, 1, 0],
      ["cc-3001", "CC-3001 行政中心", 30, 1, 0]
    ]
  };

  var GUIDE_STEPS = [
    ["在飞书审批后台配置控件", "打开你要用的审批定义，把单选/多选控件的取值方式改成「使用外部选项」，然后自定义一个 Token 并记住它。"],
    ["在这里建一个数据源", "数据源标识会进接口 URL；把上一步的 Token 粘贴进表单。"],
    ["把接口地址与 Token 填回审批后台", "点「校验数据」，确认审批里能正常拉到这组选项。"],
    ["在多维表格配自动化推送选项", "HTTP 节点带上管理 Token 调写入接口，选项随表格变动自动更新。"]
  ];

  var S = {
    scenario: "data", role: "ops", theme: null, route: "list", current: null,
    dialog: null, guideOpen: false, density: "normal", densityMenu: false, densityTouched: false,
    menu: null, flash: null, busy: false, formError: "", tokenVisible: false,
    query: "", filter: "all", page: 1, pageSize: 8
  };

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function icon(id, extra) {
    return '<svg class="i ' + (extra || "") + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }
  function sourceOf(key) {
    for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i].key === key) return SOURCES[i];
    return null;
  }
  function canWrite() { return S.role === "ops"; }

  function filtered() {
    if (S.scenario === "empty" || S.scenario === "error") return [];
    var keyword = S.query.trim().toLowerCase();
    return SOURCES.filter(function (source) {
      if (S.filter !== "all" && source.status !== S.filter) return false;
      if (!keyword) return true;
      return (source.title + " " + source.key).toLowerCase().indexOf(keyword) >= 0;
    });
  }

  function statusCell(source) {
    return source.status === "active"
      ? '<span class="tone tone-positive">' + icon("i-check-circle", "i-14") + "启用</span>"
      : '<span class="tone tone-warning">' + icon("i-clock", "i-14") + "已停用</span>";
  }

  function renderRowMenu(source) {
    if (S.menu !== source.key || !canWrite()) return "";
    var off = source.status === "disabled";
    return '<div class="menu" role="menu">' +
      '<button type="button" role="menuitem" data-act="open-rename" data-key="' + esc(source.key) + '">' + icon("i-pen") + "重命名</button>" +
      (off
        ? '<button type="button" role="menuitem" data-act="open-status" data-key="' + esc(source.key) + '">' + icon("i-power") + "启用</button>" +
          '<button type="button" role="menuitem" disabled title="该数据源已是停用状态">' + icon("i-clock") + "停用</button>"
        : '<button type="button" role="menuitem" data-act="open-status" data-key="' + esc(source.key) + '">' + icon("i-power") + "停用</button>") +
      '<div class="menu-sep"></div>' +
      '<button type="button" role="menuitem" class="menu-danger" data-act="open-delete" data-key="' + esc(source.key) + '">' + icon("i-trash") + "删除</button>" +
      "</div>";
  }

  function renderGuide() {
    if (!S.guideOpen) return "";
    var steps = GUIDE_STEPS.map(function (step, index) {
      return '<li class="guide-step"><span class="guide-num">' + (index + 1) + "</span>" +
        "<div><strong>" + esc(step[0]) + "</strong><p>" + esc(step[1]) + "</p></div></li>";
    }).join("");
    return '<section class="guide"><ol class="guide-steps">' + steps + "</ol>" +
      '<div class="guide-warn">' + icon("i-alert", "i-14") +
      "<span>Token 只在飞书那边显示一次。服务端只保存它的摘要，之后无法回显，请先复制到安全的地方。</span></div></section>";
  }

  function renderToolbar() {
    var filteredOut = filtered();
    var showControls = S.scenario !== "empty" && S.scenario !== "error";
    var filterSeg = ["all", "active", "disabled"].map(function (value) {
      var label = value === "all" ? "全部" : value === "active" ? "启用" : "停用";
      return '<button type="button" data-act="filter" data-v="' + value + '" aria-pressed="' + (S.filter === value) + '">' + label + "</button>";
    }).join("");
    return '<div class="toolbar">' +
      (showControls
        ? '<div class="search">' + icon("i-search") +
          '<input type="text" id="q" value="' + esc(S.query) + '" placeholder="搜索名称或标识" aria-label="搜索数据源">' +
          "</div>" +
          '<div class="seg" data-seg="filter">' + filterSeg + "</div>"
        : "") +
      '<div class="toolbar-spacer"></div>' +
      '<button class="disclosure" type="button" data-act="toggle-guide" aria-expanded="' + S.guideOpen + '">' +
      icon("i-chevron-right", "i-14") + "首次使用？看四步配置" + "</button>" +
      (canWrite()
        ? '<button class="btn btn-default" type="button" data-act="open-create">' + icon("i-plus") + "添加数据源</button>"
        : "") +
      (filteredOut.length === 0 && showControls ? '<span class="sr">没有匹配的数据源</span>' : "") +
      "</div>";
  }

  function renderTable() {
    var rows = filtered();
    if (rows.length === 0) {
      return '<div class="empty">' +
        '<div class="empty-icon">' + icon("i-database") + "</div>" +
        "<h2>还没有数据源</h2>" +
        "<p>先在飞书审批后台配好控件并拿到 Token，再回来建第一个。</p>" +
        '<div class="empty-actions">' +
        (canWrite() ? '<button class="btn btn-default" type="button" data-act="open-create">' + icon("i-plus") + "添加数据源</button>" : "") +
        '<button class="btn btn-outline" type="button" data-act="toggle-guide">' + icon("i-help") + "怎么拿到 Token？</button>" +
        "</div></div>";
    }
    var body = rows.map(function (source) {
      var off = source.status === "disabled";
      return '<tr data-act="open-detail" data-key="' + esc(source.key) + '" data-off="' + off + '" tabindex="0">' +
        "<td>" + esc(source.title) + "</td>" +
        '<td class="mono" style="font-size:13px">' + esc(source.key) + "</td>" +
        "<td>" + statusCell(source) + "</td>" +
        '<td>' + (source.encrypt ? '<span class="tone tone-neutral">' + icon("i-lock", "i-14") + "已加密</span>" : '<span style="color:var(--muted-foreground)">—</span>') + "</td>" +
        '<td class="mono" style="font-size:13px">' + esc(source.locale) + "</td>" +
        '<td class="cell-action">' +
        (canWrite()
          ? '<button class="icon-btn icon-btn-sm row-actions" type="button" data-act="toggle-menu" data-key="' + esc(source.key) + '" aria-label="更多操作" aria-haspopup="menu">' + icon("i-more") + "</button>"
          : "") +
        renderRowMenu(source) +
        "</td></tr>";
    }).join("");
    var pages = Math.max(1, Math.ceil(rows.length / S.pageSize));
    return '<div class="table-wrap"><table>' +
      '<thead><tr><th>名称</th><th>标识</th><th>状态</th><th>加密</th><th>默认语言</th><th><span class="sr">操作</span></th></tr></thead>' +
      "<tbody>" + body + "</tbody></table>" +
      '<div class="table-foot"><span>共 ' + rows.length + " 个数据源</span>" +
      '<div class="pager"><button class="icon-btn icon-btn-sm" type="button" data-act="page-prev" aria-label="上一页" disabled>' + icon("i-chevron-left") + "</button>" +
      "第 " + S.page + " / " + pages + " 页" +
      '<button class="icon-btn icon-btn-sm" type="button" data-act="page-next" aria-label="下一页" disabled>' + icon("i-chevron-right") + "</button></div>" +
      "</div></div>";
  }

  function renderLoading() {
    var rows = "";
    for (var i = 0; i < 7; i++) {
      rows += '<div class="skeleton" style="height:' + (S.density === "compact" ? 24 : S.density === "loose" ? 40 : 30) + 'px"></div>';
    }
    return '<div class="loading-pad" style="padding:32px;display:grid;gap:12px">' +
      '<div class="skeleton" style="height:32px;width:256px"></div>' +
      '<div class="skeleton" style="height:16px;width:384px"></div>' +
      '<div class="table-wrap"><div class="skeleton-rows">' + rows + "</div></div></div>";
  }

  function renderError() {
    return '<div class="alert-error" role="alert" style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
      "<span>数据源加载失败：数据源不存在</span>" +
      '<button class="btn btn-outline btn-sm" type="button" data-act="retry">' + icon("i-refresh") + "重试</button></div>";
  }

  function renderList() {
    var head = '<div class="page-head">' +
      "<div><h1>飞书数据源</h1>" +
      '<p class="page-sub">管理飞书审批里使用的外部选项数据源，查看每个数据源下的选项</p></div>' +
      "</div>";
    var flash = S.flash ? '<p class="alert-neutral" aria-live="polite" style="margin-bottom:16px">' + esc(S.flash) + "</p>" : "";
    var body;
    if (S.scenario === "loading") {
      body = renderLoading();
      return head + flash + renderGuide() + body;
    }
    if (S.scenario === "error") {
      return head + flash + renderGuide() + renderError();
    }
    return head + flash + renderGuide() + renderToolbar() + renderTable();
  }

  function renderDetail() {
    var source = sourceOf(S.current);
    if (!source) return '<p class="alert-error" role="alert">数据源不存在</p>';
    var rows = (OPTIONS[source.key] || []).map(function (row) {
      var enabled = row[3] === 1;
      return '<tr data-off="' + (!enabled) + '">' +
        "<td>" + esc(row[1]) + (row[4] === 1 ? ' <span class="tone tone-info">默认</span>' : "") + "</td>" +
        '<td class="mono" style="font-size:13px">' + esc(row[0]) + "</td>" +
        '<td class="numeric">' + row[2] + "</td>" +
        "<td>" + (enabled
          ? '<span class="tone tone-positive">' + icon("i-check-circle", "i-14") + "启用</span>"
          : '<span class="tone tone-warning">' + icon("i-clock", "i-14") + "已停用</span>") + "</td></tr>";
    }).join("");
    return '<button class="back" type="button" data-act="back">' + icon("i-arrow-left", "i-14") + "返回数据源</button>" +
      '<div class="page-head">' +
      "<div><h1>" + esc(source.title) + "</h1>" +
      '<p class="page-sub"><span class="mono">' + esc(source.key) + "</span> · 默认语言 " + esc(source.locale) + "</p></div>" +
      '<div class="head-actions">' + statusCell(source) +
      (source.encrypt ? '<span class="tone tone-neutral">' + icon("i-lock", "i-14") + "已加密</span>" : "") +
      "</div></div>" +
      (source.status === "disabled"
        ? '<p class="alert-neutral" role="status" style="margin-bottom:16px">该数据源已停用，飞书审批里当前拉不到它的选项。</p>'
        : "") +
      '<p class="notice">' + icon("i-info", "i-14") + "选项由多维表格自动推送，控制台只读。</p>" +
      '<div class="table-wrap"><table>' +
      '<thead><tr><th>选项名称</th><th>选项标识</th><th class="numeric">排序</th><th>状态</th></tr></thead>' +
      "<tbody>" + rows + "</tbody></table></div>";
  }

  function renderDialog() {
    if (!S.dialog) return "";
    var kind = S.dialog.kind;
    var source = S.dialog.key ? sourceOf(S.dialog.key) : null;
    var err = S.formError ? '<p class="err">' + esc(S.formError) + "</p>" : "";

    if (kind === "delete") {
      return '<div class="overlay" data-act="overlay">' +
        '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">' +
        '<button class="dialog-x" type="button" data-act="close-dialog" aria-label="关闭">' + icon("i-x") + "</button>" +
        '<div class="dialog-head"><h2 id="dlg-title">删除数据源</h2></div>' +
        '<div class="dialog-body"><p class="dialog-key mono">' + esc(source.key) + " · " + esc(source.title) + "</p>" +
        "<p>删除后其下全部选项会被同时停用，且不可恢复。确认删除？</p></div>" +
        '<div class="dialog-foot"><button class="btn btn-outline" type="button" data-act="close-dialog">取消</button>' +
        '<button class="btn btn-destructive" type="button" data-act="submit-delete" data-key="' + esc(source.key) + '">' +
        (S.busy ? "删除中…" : "删除") + "</button></div></div></div>";
    }
    if (kind === "status") {
      var off = source.status === "disabled";
      return '<div class="overlay" data-act="overlay">' +
        '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">' +
        '<button class="dialog-x" type="button" data-act="close-dialog" aria-label="关闭">' + icon("i-x") + "</button>" +
        '<div class="dialog-head"><h2 id="dlg-title">' + (off ? "启用数据源" : "停用数据源") + "</h2></div>" +
        '<div class="dialog-body"><p class="dialog-key mono">' + esc(source.key) + " · " + esc(source.title) + "</p>" +
        "<p>" + (off
          ? "启用后，飞书审批里可以重新拉到这个数据源的选项。确认启用？"
          : "停用后，飞书审批里将拉不到这个数据源的选项；已保存的选项不会被删除，重新启用即可恢复。确认停用？") + "</p></div>" +
        '<div class="dialog-foot"><button class="btn btn-outline" type="button" data-act="close-dialog">取消</button>' +
        '<button class="btn btn-default" type="button" data-act="submit-status" data-key="' + esc(source.key) + '">' +
        (S.busy ? "提交中…" : off ? "启用" : "停用") + "</button></div></div></div>";
    }

    var isCreate = kind === "create";
    var values = isCreate
      ? { key: "", title: "", token: "", encrypt: false, locale: "zh-CN" }
      : { key: source.key, title: source.title, token: "", encrypt: source.encrypt, locale: source.locale };
    var draft = S.draft || values;
    return '<div class="overlay" data-act="overlay">' +
      '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">' +
      '<button class="dialog-x" type="button" data-act="close-dialog" aria-label="关闭">' + icon("i-x") + "</button>" +
      '<div class="dialog-head"><h2 id="dlg-title">' + (isCreate ? "添加数据源" : "重命名数据源") + "</h2>" +
      "<p>" + (isCreate
        ? "在飞书审批后台配好「使用外部选项」的控件后，把它的标识与 Token 填在这里。"
        : "只改显示名称，不影响飞书审批里已配好的接口。") + "</p></div>" +
      '<div class="dialog-body">' +
      (isCreate
        ? '<div class="field"><label for="f-key">数据源标识（1–64 字符）</label>' +
          '<input id="f-key" type="text" class="mono" value="' + esc(draft.key) + '" placeholder="expense-category"' +
          (S.formError && !draft.key.trim() ? ' aria-invalid="true"' : "") + ">" +
          '<p class="hint">会出现在接口 URL 里，创建后不可修改。</p></div>'
        : "") +
      '<div class="field"><label for="f-title">显示名称（1–100 字符）</label>' +
      '<input id="f-title" type="text" value="' + esc(draft.title) + '" placeholder="报销事由分类"' +
      (S.formError && !draft.title.trim() ? ' aria-invalid="true"' : "") + "></div>" +
      (isCreate
        ? '<div class="field"><label for="f-token">接口 Token</label><div class="input-group">' +
          '<input id="f-token" type="' + (S.tokenVisible ? "text" : "password") + '" value="' + esc(draft.token) + '" placeholder="粘贴飞书审批后台里配置的那个 Token" autocomplete="off">' +
          '<button class="btn btn-outline" type="button" data-act="toggle-token">' + (S.tokenVisible ? "隐藏" : "显示") + "</button>" +
          '</div><p class="hint">服务端只保存摘要，保存后无法回显；要轮换就重新填一个新的。</p></div>' +
          '<label class="check"><input type="checkbox" id="f-encrypt"' + (draft.encrypt ? " checked" : "") + ">" +
          '<span class="check-text"><strong>加密存储</strong><span>开启后 Token 以密文保存</span></span></label>' +
          '<div class="field"><label for="f-locale">默认语言</label><select id="f-locale">' +
          '<option value="zh-CN"' + (draft.locale === "zh-CN" ? " selected" : "") + ">简体中文（zh-CN）</option>" +
          '<option value="en-US"' + (draft.locale === "en-US" ? " selected" : "") + ">English（en-US）</option></select></div>"
        : "") +
      err + "</div>" +
      '<div class="dialog-foot"><button class="btn btn-outline" type="button" data-act="close-dialog">取消</button>' +
      '<button class="btn btn-default" type="button" data-act="submit-form">' +
      (S.busy ? "提交中…" : isCreate ? "添加数据源" : "保存名称") + "</button></div></div></div>";
  }

  function renderDensityMenu() {
    if (!S.densityMenu) return "";
    return '<div class="menu" role="menu" style="right:0;left:auto;top:40px">' +
      ["compact", "normal", "loose"].map(function (value) {
        var label = value === "compact" ? "紧凑" : value === "normal" ? "标准" : "宽松";
        return '<button type="button" role="menuitem" data-act="density" data-v="' + value + '">' +
          label + (S.density === value ? icon("i-check") : "") + "</button>";
      }).join("") + "</div>";
  }

  function render() {
    if (S.theme) {
      document.documentElement.dataset.theme = S.theme;
      document.documentElement.classList.toggle("dark", S.theme === "dark");
    } else {
      delete document.documentElement.dataset.theme;
      document.documentElement.classList.remove("dark");
    }
    document.documentElement.dataset.density = S.density;
    var role = ROLES[S.role];
    document.getElementById("identity-name").textContent = role.name;
    document.getElementById("identity-avatar").textContent = role.initial;
    document.getElementById("page").innerHTML = S.route === "detail" ? renderDetail() : renderList();
    document.getElementById("overlay-root").innerHTML = renderDialog();
    document.getElementById("density-menu").innerHTML = renderDensityMenu();
    var activeTheme = S.theme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.querySelectorAll("[data-seg]").forEach(function (group) {
      var key = group.dataset.seg;
      group.querySelectorAll("button").forEach(function (button) {
        var value = key === "theme" ? activeTheme : S[key];
        button.setAttribute("aria-pressed", String(button.dataset.v === value));
      });
    });
    document.getElementById("theme-icon").innerHTML =
      '<use href="#' + (activeTheme === "dark" ? "i-sun" : "i-moon") + '"/>';
    var search = document.getElementById("q");
    if (search && S.query) { search.value = S.query; }
  }

  function readForm() {
    var get = function (id) { var el = document.getElementById(id); return el ? el.value : ""; };
    return {
      key: get("f-key"), title: get("f-title"), token: get("f-token"),
      locale: get("f-locale") || "zh-CN",
      encrypt: !!(document.getElementById("f-encrypt") && document.getElementById("f-encrypt").checked)
    };
  }
  function openDialog(kind, key) {
    S.dialog = { kind: kind, key: key || null };
    S.formError = ""; S.busy = false; S.tokenVisible = false; S.draft = null;
    render();
    var first = document.querySelector(".dialog input");
    if (first) first.focus();
  }
  function closeDialog() {
    S.dialog = null; S.formError = ""; S.busy = false; S.draft = null;
    render();
  }
  function submitForm() {
    var kind = S.dialog.kind;
    var draft = readForm();
    S.draft = draft;
    if (kind === "create") {
      if (!draft.key.trim()) { S.formError = "数据源标识不能为空"; return render(); }
      if (!/^[a-z0-9-]{1,64}$/.test(draft.key)) { S.formError = "数据源标识只能用小写字母、数字与连字符（1–64 字符）"; return render(); }
      if (!draft.title.trim()) { S.formError = "显示名称不能为空"; return render(); }
      if (!draft.token.trim()) { S.formError = "Token 不能为空；不轮换请省略该字段"; return render(); }
    } else if (!draft.title.trim()) {
      S.formError = "显示名称不能为空";
      return render();
    }
    S.busy = true; render();
    window.setTimeout(function () {
      S.busy = false;
      var source = sourceOf(draft.key);
      if (kind === "rename" && source) source.title = draft.title.trim();
      S.flash = kind === "create" ? "已添加数据源 " + draft.key.trim() : "已重命名数据源 " + draft.key;
      closeDialog();
    }, 550);
  }
  function submitDelete(key) {
    S.busy = true; render();
    window.setTimeout(function () {
      S.busy = false;
      S.flash = "已删除数据源 " + key + "，其下选项已同时停用";
      S.route = "list";
      closeDialog();
    }, 550);
  }
  function submitStatus(key) {
    var source = sourceOf(key);
    var next = source.status === "disabled" ? "active" : "disabled";
    S.busy = true; render();
    window.setTimeout(function () {
      source.status = next;
      S.busy = false;
      S.flash = next === "active" ? "已启用数据源 " + key : "已停用数据源 " + key;
      closeDialog();
    }, 550);
  }

  var KEEP_MENU = { "toggle-menu": 1, "open-rename": 1, "open-delete": 1, "open-status": 1, "density-menu": 1, "density": 1 };

  document.addEventListener("click", function (event) {
    var overlay = event.target.closest(".overlay");
    if (overlay && event.target === overlay) { closeDialog(); return; }
    var node = event.target.closest("[data-act]");
    if (!node) {
      var changed = false;
      if (S.menu) { S.menu = null; changed = true; }
      if (S.densityMenu) { S.densityMenu = false; changed = true; }
      if (changed) render();
      return;
    }
    var act = node.dataset.act;
    var key = node.dataset.key;
    if (!KEEP_MENU[act]) {
      if (S.menu) S.menu = null;
      if (S.densityMenu) S.densityMenu = false;
    }
    if (act === "toggle-guide") S.guideOpen = !S.guideOpen;
    else if (act === "open-create") return openDialog("create");
    else if (act === "open-rename") return openDialog("rename", key);
    else if (act === "open-delete") return openDialog("delete", key);
    else if (act === "open-status") return openDialog("status", key);
    else if (act === "open-detail") { S.route = "detail"; S.current = key; S.menu = null; }
    else if (act === "back") { S.route = "list"; S.menu = null; }
    else if (act === "toggle-menu") S.menu = S.menu === key ? null : key;
    else if (act === "density-menu") S.densityMenu = !S.densityMenu;
    else if (act === "density") { S.density = node.dataset.v; S.densityTouched = true; S.densityMenu = false; }
    else if (act === "theme-toggle") { S.theme = (S.theme || window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") === "dark" ? "light" : "dark"; }
    else if (act === "close-dialog" || act === "overlay") return closeDialog();
    else if (act === "toggle-token") { S.draft = readForm(); S.tokenVisible = !S.tokenVisible; }
    else if (act === "submit-form") return submitForm();
    else if (act === "submit-delete") return submitDelete(key);
    else if (act === "submit-status") return submitStatus(key);
    else if (act === "filter") { S.filter = node.dataset.v; }
    else if (act === "scenario") { S.scenario = node.dataset.v; S.flash = null; S.route = "list"; }
    else if (act === "role") { S.role = node.dataset.v; S.route = "list"; S.menu = null; }
    else if (act === "theme") S.theme = node.dataset.v;
    else if (act === "retry") { S.scenario = "data"; S.flash = null; }
    render();
  });

  document.addEventListener("input", function (event) {
    if (event.target.id === "q") {
      S.query = event.target.value;
      render();
      var search = document.getElementById("q");
      if (search) { search.focus(); search.setSelectionRange(S.query.length, S.query.length); }
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      if (S.dialog) { closeDialog(); return; }
      if (S.menu || S.densityMenu) { S.menu = null; S.densityMenu = false; render(); return; }
      if (S.route === "detail") { S.route = "list"; render(); return; }
    }
    if ((event.key === "Enter" || event.key === " ") && event.target.tagName === "TR" && event.target.dataset.act) {
      event.preventDefault();
      S.route = "detail";
      S.current = event.target.dataset.key;
      render();
    }
  });

  render();
})();
</script>
</body>
</html>

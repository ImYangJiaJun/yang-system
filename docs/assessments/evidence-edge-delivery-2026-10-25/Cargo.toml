[package]
name = "edge-delivery-layer-repro"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tower = { version = "=0.5.3", features = ["util", "limit", "load-shed"] }
tower-http = { version = "=0.7.0", features = ["timeout", "trace"] }
tracing = "=0.1.44"

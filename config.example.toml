[app]
name = "yang-system"

[http]
bind = "127.0.0.1:8080"
max_body_bytes = 1048576
request_timeout_seconds = 30
max_concurrency = 256

[mysql]
# 运行时由 DATABASE_URL 环境变量覆盖。
url = "${DATABASE_URL}"
max_connections = 20
min_connections = 2
connect_timeout_seconds = 10
idle_timeout_seconds = 600
max_lifetime_seconds = 1800
test_before_acquire = true

[redis]
# 运行时由 REDIS_URL 环境变量覆盖。
url = "${REDIS_URL}"
max_connections = 20
min_connections = 2
connect_timeout_seconds = 5
wait_timeout_seconds = 10
idle_timeout_seconds = 300
max_lifetime_seconds = 1800
test_before_acquire = true

[token]
# 不要在文件中保存真实密钥；运行时由 TOKEN_SECRET 环境变量覆盖。
secret = "${TOKEN_SECRET}"
issuer = "yang-system"
audience = "yang-system-api"
access_ttl_seconds = 3600
refresh_ttl_seconds = 2592000

[security]
argon2_max_concurrency = 4
auth_rate_limit_window_seconds = 60
auth_rate_limit_ip_attempts = 30
auth_rate_limit_username_attempts = 10

[logging]
filter = "yang_system=info,tower_http=info"

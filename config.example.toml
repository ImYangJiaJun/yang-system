# 启动配置只合成一次，固定优先级为：本文件 < YANG_SYSTEM_* 环境变量 < secret 目录。
# 本文件只保留必须填写的环境事实与部署决策；连接池、超时、限流、TTL 等调优项
# 均有内置安全默认值（取本文件历史基线值），需要偏离时按名显式覆盖即可。
# 环境变量、secret 文件与全部默认值的完整契约见 docs/contracts/CONFIGURATION.md。

[app]
environment = "development"

[authorization]
# 同一 Redis DB 内必须唯一且发布后保持稳定；只允许小写字母、数字和连字符。
# 同时作为三类邮箱验证码 Redis key 的默认部署命名空间。
deployment = "local"

[http]
bind = "127.0.0.1:8080"

[mysql]
# 复制为 config.toml 后，直接填写当前环境的连接信息。
url = "mysql://root:password@127.0.0.1:3306/yang_system"

[redis]
url = "redis://127.0.0.1:6379"

[token]
# active key 负责签发；轮换时用 retiring_keys（[{ key_id, secret }] 或
# YANG_SYSTEM_TOKEN_RETIRING_KEYS_JSON）保留旧 key 至少一个 refresh TTL。
active_key_id = "local-2026-07"
# 必须替换为至少 32 字节的随机密钥；该占位值会被启动校验拒绝。
active_secret = "replace-with-at-least-32-random-bytes"
retiring_keys = []

[step_up]
# Step-up 使用独立签名域；不得与 Access/Refresh Token 复用任何密钥。
active_key_id = "local-step-up-2026-07"
# 必须替换为独立的至少 32 字节随机密钥。
active_secret = "replace-with-independent-step-up-secret"
retiring_keys = []

[email.smtp]
# 仅接受强制 STARTTLS 的 SMTP relay 主机名（默认端口 587）；
# 不要填写 scheme 或把凭据写入 URL。
relay = "smtp.example.com"
username = "replace-with-smtp-username"
password = "replace-with-smtp-password"
from_address = "no-reply@example.com"
from_name = "YANG System"

# 注册、换绑、登录 MFA 备用三类邮箱验证码使用相互独立的密钥域：绝不复用彼此，
# 也不复用 token/step-up/security.totp 的密钥，否则验证码可跨场景重放。
# 删除 [email.change] / [email.mfa] 整段即关闭对应能力（端点返回「未启用」错误）。
[email.verification]
secret = "replace-with-independent-email-verification-secret"

[email.change]
secret = "replace-with-independent-change-email-secret"

[email.mfa]
secret = "replace-with-independent-mfa-email-secret"

[email.password_reset]
# 密码重置邮件中链接指向的前端控制台入口（scheme + host[:port]，无路径与查询串）。
# 生产环境必须使用 https；不得从请求 Host 头推导（Host 头可被攻击者伪造）。
link_base_url = "http://localhost:5273"

[security]
# 三阶段发布已完成：本系统无旧实例，示例配置直接开启 Refresh 凭据版本签发，
# 同时启用会递增该版本的 change_password / disable / reset_password Action。
# 接入存量旧部署时必须先保持 false 兼容读取，确认无旧实例后再改为 true。
issue_refresh_credential_version = true
# 默认不信任任何 Forwarded/X-Forwarded-For；仅填写实际反向代理的最小 CIDR。
# 示例：trusted_proxy_cidrs = ["127.0.0.1/32", "10.42.0.0/24"]

# TOTP 第二因子（MFA）。aead_key 是加密 users.totp_secret 的独立密钥域：
# 禁止与 token/step-up/邮箱验证码密钥复用。删除此段则 MFA Action 不注册。
[security.totp]
aead_key = "replace-with-an-independent-32-byte-totp-aead-key"

[observability]
# Prometheus 使用独立运维监听地址（默认 127.0.0.1:9090），生产环境必须保持开启；
# 未部署 OpenTelemetry Collector 时 traces 保持关闭，启用方式见配置契约文档。
metrics_enabled = true

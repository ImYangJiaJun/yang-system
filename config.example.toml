# 启动配置只合成一次，固定优先级为：本文件 < YANG_SYSTEM_* 环境变量 < secret 目录。
# 环境变量和 secret 文件的完整契约见 docs/CONFIGURATION.md。

[app]
name = "yang-system"
# development/test 可在受控场景显式 apply；缺省按 production 处理。
environment = "development"

[authorization]
# 同一 Redis DB 内必须唯一且发布后保持稳定；只允许小写字母、数字和连字符。
deployment = "local"
# 授权变更传播轮询不得高于 250ms，目标 p99 不超过 2s。
outbox_poll_interval_ms = 250
outbox_batch_size = 100
outbox_lease_seconds = 10
outbox_max_retry_seconds = 60

[schema]
# 安全默认值为 validate；首次建表与升级优先使用独立 yang-migrate 作业。
mode = "validate"

[http]
bind = "127.0.0.1:8080"
max_body_bytes = 1048576
request_timeout_seconds = 30
max_concurrency = 256

[mysql]
# 复制为 config.toml 后，直接填写当前环境的连接信息。
url = "mysql://root:password@127.0.0.1:3306/yang_system"
max_connections = 20
min_connections = 2
connect_timeout_seconds = 10
idle_timeout_seconds = 600
max_lifetime_seconds = 1800
test_before_acquire = true

[redis]
url = "redis://127.0.0.1:6379"
max_connections = 20
min_connections = 2
connect_timeout_seconds = 5
wait_timeout_seconds = 10
idle_timeout_seconds = 300
max_lifetime_seconds = 1800
test_before_acquire = true

[token]
# active key 负责签发；retiring key 只验证存量 Token，至少保留一个 refresh TTL。
active_key_id = "local-2026-07"
# 必须替换为至少 32 字节的随机密钥；该占位值会被启动校验拒绝。
active_secret = "replace-with-at-least-32-random-bytes"
retiring_keys = []
issuer = "yang-system"
audience = "yang-system-api"
access_ttl_seconds = 3600
refresh_ttl_seconds = 2592000

[step_up]
# Step-up 使用独立签名域；不得与 Access/Refresh Token 复用任何密钥。
active_key_id = "local-step-up-2026-07"
# 必须替换为独立的至少 32 字节随机密钥；该占位值会被启动校验拒绝。
active_secret = "replace-with-independent-step-up-secret"
# retiring key 只验证存量 challenge/proof；至少保留一个 proof TTL。
retiring_keys = []
issuer = "yang-system-step-up"
audience = "yang-system-sensitive-actions"
challenge_ttl_seconds = 120
proof_ttl_seconds = 300

[email.smtp]
# 仅接受强制 STARTTLS 的 SMTP relay 主机名；不要填写 scheme 或把凭据写入 URL。
relay = "smtp.example.com"
port = 587
username = "replace-with-smtp-username"
password = "replace-with-smtp-password"
from_address = "no-reply@example.com"
from_name = "YANG System"
timeout_seconds = 10

[email.verification]
# 共享 Redis 时按部署隔离 key；只允许 ASCII 字母、数字、点、下划线与连字符。
namespace = "local"
# 必须使用独立随机密钥，不得与 Token 或 Step-up 复用；该占位值会被启动拒绝。
secret = "replace-with-independent-email-verification-secret"
ttl_seconds = 600
resend_cooldown_seconds = 60
max_attempts = 5
send_window_seconds = 3600
send_ip_attempts = 20
send_email_attempts = 5
# 全局容量闸门高于单 IP/邮箱额度，避免单个攻击者耗尽邮件服务。
send_global_attempts = 1000

[security]
argon2_max_concurrency = 4
auth_rate_limit_window_seconds = 60
auth_rate_limit_ip_attempts = 30
auth_rate_limit_username_attempts = 10
# 密码重置凭证只返回一次，建议保持短 TTL；允许范围 60..=3600 秒。
password_reset_ttl_seconds = 900
# 三阶段发布：先保持 false 部署兼容读取；确认无旧实例后改为 true，同时开启
# Refresh 凭据版本签发与会递增该版本的 change_password Action。
issue_refresh_credential_version = false
# 默认不信任任何 Forwarded/X-Forwarded-For；仅填写实际反向代理的最小 CIDR。
# 示例：trusted_proxy_cidrs = ["127.0.0.1/32", "10.42.0.0/24"]
trusted_proxy_cidrs = []

[shutdown]
# 从收到退出信号起，HTTP 排空、后台任务退出和资源关闭共享这一总预算。
total_timeout_seconds = 30

[observability]
# Prometheus 使用独立运维监听地址；生产环境应由网络策略限制采集端访问。
metrics_enabled = true
metrics_bind = "127.0.0.1:9090"
# 未部署 OpenTelemetry Collector 时保持关闭；启用后使用 OTLP/gRPC 导出。
traces_enabled = false
traces_otlp_endpoint = "http://127.0.0.1:4317"
traces_sample_ratio = 0.1
traces_export_timeout_seconds = 5
# 管理面 /health/ready 检查 MySQL/Redis 的唯一总预算。
readiness_budget_ms = 2000

[logging]
# 输出一行一个 JSON object；filter 只控制级别，不改变生产日志结构。
filter = "yang_system=info,tower_http=info"

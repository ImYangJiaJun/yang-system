[package]
name = "yang-system"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
anyhow = "1.0"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
jsonwebtoken = "=9.3.1"
rand_core = { version = "0.6", features = ["getrandom"] }
schemars = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
serde_urlencoded = "0.7"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "mysql", "derive"] }
tokio = { version = "1.52.1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yang-base = { version = "0.1.3", git = "ssh://git@github.com/ImYangJiaJun/lib_yang.git", rev = "b65a50bd5f0161f7f93f1c60000d4ea5471b600b", default-features = false, features = ["mysql", "token", "validator"] }
yang-db = { version = "0.1.4", git = "ssh://git@github.com/ImYangJiaJun/lib_yang.git", rev = "b65a50bd5f0161f7f93f1c60000d4ea5471b600b", default-features = false, features = ["mysql", "redis"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "yang-system"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
default-run = "yang-system"

[dependencies]
yang-base = { version = "0.3.0", path = "../../crates/yang-base", default-features = false, features = ["mysql", "token", "validator", "openapi", "admin-metadata", "transport-axum", "metrics", "http"] }
yang-db = { version = "0.2.0", path = "../../crates/yang-db", default-features = false, features = ["mysql", "redis"] }
yang-runtime = { version = "0.1.0", path = "../../crates/yang-runtime" }

anyhow = "1.0"
async-trait = "0.1.89"
jsonwebtoken = "=9.3.1"
# 精确锁定：0.11.20+ 需要 Rust 1.85，受 MSRV 1.80 约束
lettre = { version = "=0.11.19", default-features = false, features = ["builder", "pool", "ring", "smtp-transport", "tokio1-rustls", "webpki-roots"] }
metrics = "0.24.2"
rand_core = { version = "0.6", features = ["getrandom"] }
schemars = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "mysql"] }
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
uuid = { version = "=1.12.1", features = ["v4"] }
tracing = "0.1.41"
aes-gcm = "0.10.3"
base64 = "0.22"
# 飞书外部选项接口的 AES-256-CBC 加解密（与 aes-gcm 同代，不产生重复版本）
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
subtle = "2.6"

[features]
default = ["account"]
account = []

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "yang-system"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
default-run = "yang-system"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
jsonwebtoken = "=9.3.1"
lettre = { version = "=0.11.22", default-features = false, features = ["builder", "pool", "ring", "smtp-transport", "tokio1-rustls", "webpki-roots"] }
metrics = "0.24.2"
rand_core = { version = "0.6", features = ["getrandom"] }
schemars = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "mysql"] }
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
tracing = "0.1.41"
yang-base = { version = "0.2.0", path = "../../crates/yang-base", default-features = false, features = ["mysql", "token", "validator", "openapi", "admin-metadata", "transport-axum", "metrics"] }
yang-db = { version = "0.1.4", path = "../../crates/yang-db", default-features = false, features = ["mysql", "redis"] }
yang-runtime = { version = "0.1.0", path = "../../crates/yang-runtime" }

[features]
default = ["account", "admin", "observability", "org", "work"]
account = []
admin = ["account"]
org = ["account"]
work = ["account"]
observability = ["account"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[app]
name = "yang-system"

[http]
bind = "0.0.0.0:8080"
max_body_bytes = 1048576

[mysql]
#mysql://用户名:密码@主机地址:端口/数据库名
url = "mysql://root:111111@127.0.0.1:3306/yang"
max_connections = 20
min_connections = 2
connect_timeout_seconds = 10
idle_timeout_seconds = 600
max_lifetime_seconds = 1800
test_before_acquire = true

[redis]
#redis://用户名:密码@主机地址:端口/数据库编号
url = "redis://127.0.0.1:6378"
max_connections = 20
min_connections = 2
connect_timeout_seconds = 5
wait_timeout_seconds = 10
idle_timeout_seconds = 300
max_lifetime_seconds = 1800
test_before_acquire = true

[token]
secret = "1111111111111111111111111111111111111111111111111111111111"
issuer = "yang-system"
audience = "yang-system-api"
access_ttl_seconds = 3600
refresh_ttl_seconds = 2592000

[security]
username_min_length = 3
username_max_length = 64
password_min_length = 10
password_max_length = 128

[logging]
filter = "yang_system=info,tower_http=info"


groups:
  - name: yang-system-slo-recording
    interval: 30s
    rules:
      - record: yang_system:sli_action_error_ratio:rate5m
        expr: |
          sum by (job) (rate(yang_system_action_requests_total{result="error"}[5m]))
          /
          clamp_min(sum by (job) (rate(yang_system_action_requests_total[5m])), 0.001)
      - record: yang_system:sli_action_error_ratio:rate1h
        expr: |
          sum by (job) (rate(yang_system_action_requests_total{result="error"}[1h]))
          /
          clamp_min(sum by (job) (rate(yang_system_action_requests_total[1h])), 0.001)
      - record: yang_system:sli_action_error_ratio:rate6h
        expr: |
          sum by (job) (rate(yang_system_action_requests_total{result="error"}[6h]))
          /
          clamp_min(sum by (job) (rate(yang_system_action_requests_total[6h])), 0.001)
      - record: yang_system:sli_action_error_ratio:rate3d
        expr: |
          sum by (job) (rate(yang_system_action_requests_total{result="error"}[3d]))
          /
          clamp_min(sum by (job) (rate(yang_system_action_requests_total[3d])), 0.001)
      - record: yang_system:sli_action_latency_p95_seconds:rate5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, le) (rate(yang_system_action_duration_seconds_bucket[5m]))
          )
      # 授权传播 SLI（ADR §7 默认目标：健康状态下 p99 不高于 2 秒）。
      # 出口在 src/infrastructure/authorization/worker.rs:238，直方图无自定义 label。
      - record: yang_system:sli_authz_propagation_p99_seconds:rate5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, le) (rate(authz_propagation_seconds_bucket[5m]))
          )

  - name: yang-system-slo-alerts
    rules:
      - alert: YangSystemAvailabilityErrorBudgetFastBurn
        expr: |
          yang_system:sli_action_error_ratio:rate5m > 0.0144
          and on (job)
          yang_system:sli_action_error_ratio:rate1h > 0.0144
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "yang-system availability error budget is burning quickly"
          runbook: "docs/contracts/SLO.md"

      - alert: YangSystemAvailabilityErrorBudgetSlowBurn
        expr: |
          yang_system:sli_action_error_ratio:rate6h > 0.001
          and on (job)
          yang_system:sli_action_error_ratio:rate3d > 0.001
        for: 30m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "yang-system availability error budget is burning continuously"
          runbook: "docs/contracts/SLO.md"

      - alert: YangSystemActionLatencyP95High
        expr: yang_system:sli_action_latency_p95_seconds:rate5m > 0.5
        for: 15m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "yang-system Action p95 latency exceeds 500 ms"
          runbook: "docs/contracts/SLO.md"

      - alert: YangSystemReadinessUnavailable
        expr: max_over_time(yang_system_readiness_ready[2m]) == 0
        for: 2m
        labels:
          severity: critical
          slo: readiness
        annotations:
          summary: "yang-system instance has not passed readiness for two minutes"
          runbook: "docs/contracts/SLO.md"

      - alert: YangSystemAuthorizationPropagationDelayed
        expr: authz_outbox_oldest_age_seconds > 2
        for: 5m
        labels:
          severity: warning
          slo: authorization_freshness
        annotations:
          summary: "authorization outbox propagation exceeds two seconds"
          runbook: "docs/contracts/SLO.md"

      # 超过 ADR §7 安全硬上限：outbox 最老 pending 年龄 > 5 秒即严重告警
      # （ADR：超过 2 秒告警，超过 5 秒严重告警）。与上面的 warning 形成分级：
      # >2s 先降级提示，>5s 升级 critical。
      - alert: YangSystemAuthorizationPropagationStalled
        expr: authz_outbox_oldest_age_seconds > 5
        for: 5m
        labels:
          severity: critical
          slo: authorization_freshness
        annotations:
          summary: "authorization outbox propagation exceeds five seconds"
          runbook: "docs/contracts/SLO.md"

      # 授权传播 SLI 违背：p99 传播延迟 >= 2 秒（ADR §7 默认目标「p99 不高于 2 秒」，
      # 直方图存在，见 yang-system-slo-recording 组的 recording rule）。
      - alert: YangSystemAuthorizationPropagationP99High
        expr: yang_system:sli_authz_propagation_p99_seconds:rate5m >= 2
        for: 15m
        labels:
          severity: warning
          slo: authorization_freshness
        annotations:
          summary: "authorization propagation p99 exceeds two seconds"
          runbook: "docs/contracts/SLO.md"

      # 审批派发积压：`dispatch` 端点受理了（页面按钮点了、返回 accepted），
      # 但队列深度连续 15 分钟没降到阈值以下。三条要一起看的语义：
      # - 认领批 = 50，所以「深度持续 ≥ 1」可能是健康吞吐，也可能是真卡住；
      # - `for: 15m` 覆盖两轮完整重试（单轮预算 300s × 2），避免在退避期间误报；
      # - 若同时 `feishu_approval_dispatch_total{outcome="terminal"}` 在涨，
      #   说明不是积压而是配置问题——见 runbook 的区分步骤。
      - alert: YangSystemApprovalDispatchBacklog
        expr: feishu_approval_pending > 0
        for: 15m
        labels:
          severity: warning
          component: feishu_approval
        annotations:
          summary: "feishu approval dispatch queue has stayed non-empty for 15 minutes"
          runbook: "docs/contracts/SLO.md"

      # 创建实例持续失败：官方限速 100 次/分钟，撞限流时会同时看到
      # `reason="rate_limit"` 的中断与 `outcome="retryable"` 的重试。
      # 连续 5 分钟非零意味着要么限速配得太高，要么飞书侧在拒绝。
      - alert: YangSystemApprovalDispatchFailing
        expr: increase(feishu_approval_dispatch_total{outcome="terminal"}[5m]) > 3
        for: 5m
        labels:
          severity: warning
          component: feishu_approval
        annotations:
          summary: "feishu approval dispatch is landing in terminal state repeatedly"
          runbook: "docs/contracts/SLO.md"

      - alert: YangSystemResourcePoolExhausted
        expr: |
          (
            yang_system_resource_pool_connections{state="open"}
            /
            ignoring (state)
            clamp_min(yang_system_resource_pool_connections{state="max"}, 1)
          ) >= 0.9
          and on (job, instance, resource)
          yang_system_resource_pool_connections{state="available"} == 0
        for: 5m
        labels:
          severity: warning
          slo: dependency_capacity
        annotations:
          summary: "yang-system dependency connection pool is exhausted"
          runbook: "docs/contracts/SLO.md"

      - alert: YangSystemAuthRateLimitDependencyUnavailable
        expr: rate(yang_system_auth_rate_limit_total{result="unavailable"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          slo: dependency_availability
        annotations:
          summary: "authentication rate limiter cannot reach Redis"
          runbook: "docs/contracts/SLO.md"

      # 注册邮件 SMTP 投递失败率：分母只计真实投递尝试（sent|failed），
      # suppressed/cooldown/limited 是投递前结果，不代表 SMTP 故障；
      # increase >= 3 防止低流量环境单次偶发失败触发不稳定百分比（见 SLO.md 口径说明）。
      - alert: YangSystemRegistrationEmailDeliveryFailing
        expr: |
          (
            sum by (job) (rate(yang_system_registration_email_total{result="failed"}[15m]))
            /
            clamp_min(sum by (job) (rate(yang_system_registration_email_total{result=~"sent|failed"}[15m])), 0.001)
          ) > 0.1
          and on (job)
          sum by (job) (increase(yang_system_registration_email_total{result="failed"}[15m])) >= 3
        for: 10m
        labels:
          severity: warning
          slo: dependency_availability
        annotations:
          summary: "yang-system registration email delivery failure ratio exceeds 10%"
          runbook: "docs/contracts/SLO.md"

      - alert: YangSystemShutdownPhaseTimedOut
        expr: increase(yang_system_shutdown_phase_total{result="timeout"}[15m]) > 0
        labels:
          severity: warning
          slo: graceful_shutdown
        annotations:
          summary: "yang-system shutdown phase exhausted the process budget"
          runbook: "docs/contracts/SLO.md"

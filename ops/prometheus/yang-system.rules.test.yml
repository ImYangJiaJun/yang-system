rule_files:
  - yang-system.rules.yml

evaluation_interval: 1m

# 告警演练：覆盖快速 burn、readiness、注册邮件投递失败率与 shutdown 超时的
# 触发/不触发正反用例。输入序列只使用真实指标名与冻结的 label 枚举，
# job/instance 模拟 Prometheus 抓取目标标签。
tests:
  # 快速 burn：5m 与 1h 错误率同时超过 14.4 倍预算（0.0144），应触发 critical。
  - interval: 1m
    input_series:
      - series: 'yang_system_action_requests_total{job="yang-system", instance="127.0.0.1:9090", operation="account.user.login", result="error"}'
        values: '0+4x14'
      - series: 'yang_system_action_requests_total{job="yang-system", instance="127.0.0.1:9090", operation="account.user.login", result="success"}'
        values: '0+196x14'
    alert_rule_test:
      - eval_time: 10m
        alertname: YangSystemAvailabilityErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              job: yang-system
              severity: critical
              slo: availability
            exp_annotations:
              summary: "yang-system availability error budget is burning quickly"
              runbook: "docs/contracts/SLO.md"

  # 快速 burn 反例：错误率 0.005 低于 0.0144 阈值，不应触发。
  # （该比率高于慢速 burn 的 0.001，但慢速 burn for=30m，10m 时尚未 firing。）
  - interval: 1m
    input_series:
      - series: 'yang_system_action_requests_total{job="yang-system", instance="127.0.0.1:9090", operation="account.user.login", result="error"}'
        values: '0+1x14'
      - series: 'yang_system_action_requests_total{job="yang-system", instance="127.0.0.1:9090", operation="account.user.login", result="success"}'
        values: '0+199x14'
    alert_rule_test:
      - eval_time: 10m
        alertname: YangSystemAvailabilityErrorBudgetFastBurn
        exp_alerts: []

  # readiness：连续两分钟没有一次就绪，应触发 critical。
  - interval: 1m
    input_series:
      - series: 'yang_system_readiness_ready{job="yang-system", instance="127.0.0.1:9090"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 5m
        alertname: YangSystemReadinessUnavailable
        exp_alerts:
          - exp_labels:
              job: yang-system
              instance: 127.0.0.1:9090
              severity: critical
              slo: readiness
            exp_annotations:
              summary: "yang-system instance has not passed readiness for two minutes"
              runbook: "docs/contracts/SLO.md"

  # readiness 反例：中途一次 0 抖动后恢复，2m 窗口内已有就绪，不应触发。
  - interval: 1m
    input_series:
      - series: 'yang_system_readiness_ready{job="yang-system", instance="127.0.0.1:9090"}'
        values: '1+0x4 0+0x0 1+0x4'
    alert_rule_test:
      - eval_time: 5m
        alertname: YangSystemReadinessUnavailable
        exp_alerts: []

  # 注册邮件：25% 投递失败率（sent 3/min、failed 1/min）持续超过 10 分钟，应触发 warning。
  - interval: 1m
    input_series:
      - series: 'yang_system_registration_email_total{job="yang-system", instance="127.0.0.1:9090", result="sent"}'
        values: '0+3x34'
      - series: 'yang_system_registration_email_total{job="yang-system", instance="127.0.0.1:9090", result="failed"}'
        values: '0+1x34'
    alert_rule_test:
      - eval_time: 30m
        alertname: YangSystemRegistrationEmailDeliveryFailing
        exp_alerts:
          - exp_labels:
              job: yang-system
              severity: warning
              slo: dependency_availability
            exp_annotations:
              summary: "yang-system registration email delivery failure ratio exceeds 10%"
              runbook: "docs/contracts/SLO.md"

  # 注册邮件反例一：全部投递成功，不应触发。
  - interval: 1m
    input_series:
      - series: 'yang_system_registration_email_total{job="yang-system", instance="127.0.0.1:9090", result="sent"}'
        values: '0+4x34'
      - series: 'yang_system_registration_email_total{job="yang-system", instance="127.0.0.1:9090", result="failed"}'
        values: '0+0x34'
    alert_rule_test:
      - eval_time: 30m
        alertname: YangSystemRegistrationEmailDeliveryFailing
        exp_alerts: []

  # 注册邮件反例二：无成功流量且失败量极低（约 1 封/10min），失败率比值虽为 1.0，
  # 但 15m 窗口失败增量不足 3，流量下限守卫生效，不应触发。
  - interval: 1m
    input_series:
      - series: 'yang_system_registration_email_total{job="yang-system", instance="127.0.0.1:9090", result="sent"}'
        values: '0+0x34'
      - series: 'yang_system_registration_email_total{job="yang-system", instance="127.0.0.1:9090", result="failed"}'
        values: '0+0x9 1+0x9 2+0x9 3+0x6'
    alert_rule_test:
      - eval_time: 30m
        alertname: YangSystemRegistrationEmailDeliveryFailing
        exp_alerts: []

  # shutdown 超时：15m 窗口内出现 result="timeout" 计数，应立即触发（无 for）。
  - interval: 1m
    input_series:
      - series: 'yang_system_shutdown_phase_total{job="yang-system", instance="127.0.0.1:9090", phase="http_drain", result="timeout"}'
        values: '0+0x9 1+0x5'
    alert_rule_test:
      - eval_time: 15m
        alertname: YangSystemShutdownPhaseTimedOut
        exp_alerts:
          - exp_labels:
              job: yang-system
              instance: 127.0.0.1:9090
              phase: http_drain
              result: timeout
              severity: warning
              slo: graceful_shutdown
            exp_annotations:
              summary: "yang-system shutdown phase exhausted the process budget"
              runbook: "docs/contracts/SLO.md"

  # shutdown 反例：各阶段均正常完成，timeout 计数恒为 0，不应触发。
  - interval: 1m
    input_series:
      - series: 'yang_system_shutdown_phase_total{job="yang-system", instance="127.0.0.1:9090", phase="http_drain", result="timeout"}'
        values: '0+0x14'
      - series: 'yang_system_shutdown_phase_total{job="yang-system", instance="127.0.0.1:9090", phase="http_drain", result="success"}'
        values: '0+1x14'
    alert_rule_test:
      - eval_time: 15m
        alertname: YangSystemShutdownPhaseTimedOut
        exp_alerts: []

  # 审批派发积压：队列深度连续 15 分钟非零，应触发 warning。
  - interval: 1m
    input_series:
      - series: 'feishu_approval_pending{job="yang-system", instance="127.0.0.1:9090"}'
        values: '5x24'
    alert_rule_test:
      - eval_time: 25m
        alertname: YangSystemApprovalDispatchBacklog
        exp_alerts:
          - exp_labels:
              job: yang-system
              instance: 127.0.0.1:9090
              severity: warning
              component: feishu_approval
            exp_annotations:
              summary: "feishu approval dispatch queue has stayed non-empty for 15 minutes"
              runbook: "docs/contracts/SLO.md"

  # 积压反例：队列深度恒为 0（没有待处理记录），不应触发。
  - interval: 1m
    input_series:
      - series: 'feishu_approval_pending{job="yang-system", instance="127.0.0.1:9090"}'
        values: '0x24'
    alert_rule_test:
      - eval_time: 25m
        alertname: YangSystemApprovalDispatchBacklog
        exp_alerts: []

  # 审批创建持续终态失败：1/min 持续 30 分钟，应触发 warning。
  - interval: 1m
    input_series:
      - series: 'feishu_approval_dispatch_total{job="yang-system", instance="127.0.0.1:9090", outcome="terminal"}'
        values: '0+1x34'
    alert_rule_test:
      - eval_time: 30m
        alertname: YangSystemApprovalDispatchFailing
        exp_alerts:
          - exp_labels:
              job: yang-system
              instance: 127.0.0.1:9090
              # `increase()` 保留原序列的标签——`outcome="terminal"` 是选择器
              # 约束，也在告警上出现，运维按它一眼分清「终态失败」与「waiting」。
              outcome: terminal
              severity: warning
              component: feishu_approval
            exp_annotations:
              summary: "feishu approval dispatch is landing in terminal state repeatedly"
              runbook: "docs/contracts/SLO.md"

  # 终态失败反例：全部走 waiting（数据还没填完，不是错误），不应触发。
  - interval: 1m
    input_series:
      - series: 'feishu_approval_dispatch_total{job="yang-system", instance="127.0.0.1:9090", outcome="waiting"}'
        values: '0+1x34'
    alert_rule_test:
      - eval_time: 30m
        alertname: YangSystemApprovalDispatchFailing
        exp_alerts: []

  # outbox 传播正例：最老 pending 年龄恒为 6 秒（>2 且 >5），持续超过 for 窗口，
  # warning（>2s）与 critical（>5s）应同时触发，形成分级升级。
  - interval: 1m
    input_series:
      - series: 'authz_outbox_oldest_age_seconds{job="yang-system", instance="127.0.0.1:9090"}'
        values: '6x14'
    alert_rule_test:
      - eval_time: 10m
        alertname: YangSystemAuthorizationPropagationDelayed
        exp_alerts:
          - exp_labels:
              job: yang-system
              instance: 127.0.0.1:9090
              severity: warning
              slo: authorization_freshness
            exp_annotations:
              summary: "authorization outbox propagation exceeds two seconds"
              runbook: "docs/contracts/SLO.md"
      - eval_time: 10m
        alertname: YangSystemAuthorizationPropagationStalled
        exp_alerts:
          - exp_labels:
              job: yang-system
              instance: 127.0.0.1:9090
              severity: critical
              slo: authorization_freshness
            exp_annotations:
              summary: "authorization outbox propagation exceeds five seconds"
              runbook: "docs/contracts/SLO.md"

  # outbox 传播分级反例：最老 pending 年龄恒为 3 秒，>2 秒的 warning 应触发，
  # >5 秒的 critical 不应触发——验证两级阈值各自独立生效。
  - interval: 1m
    input_series:
      - series: 'authz_outbox_oldest_age_seconds{job="yang-system", instance="127.0.0.1:9090"}'
        values: '3x14'
    alert_rule_test:
      - eval_time: 10m
        alertname: YangSystemAuthorizationPropagationDelayed
        exp_alerts:
          - exp_labels:
              job: yang-system
              instance: 127.0.0.1:9090
              severity: warning
              slo: authorization_freshness
            exp_annotations:
              summary: "authorization outbox propagation exceeds two seconds"
              runbook: "docs/contracts/SLO.md"
      - eval_time: 10m
        alertname: YangSystemAuthorizationPropagationStalled
        exp_alerts: []

  # 传播 p99 正例：5m 窗口内桶计数累计 90/98/99/100（每桶每分钟增量相同，
  # 构造成比例速率），rank=0.99 落入 le=5 桶，p99≈5s >= 2s，且持续超过 for 窗口，
  # 应触发 warning。
  - interval: 1m
    input_series:
      - series: 'authz_propagation_seconds_bucket{job="yang-system", instance="127.0.0.1:9090", le="1"}'
        values: '0+90x24'
      - series: 'authz_propagation_seconds_bucket{job="yang-system", instance="127.0.0.1:9090", le="2.5"}'
        values: '0+98x24'
      - series: 'authz_propagation_seconds_bucket{job="yang-system", instance="127.0.0.1:9090", le="5"}'
        values: '0+99x24'
      - series: 'authz_propagation_seconds_bucket{job="yang-system", instance="127.0.0.1:9090", le="+Inf"}'
        values: '0+100x24'
    alert_rule_test:
      - eval_time: 25m
        alertname: YangSystemAuthorizationPropagationP99High
        exp_alerts:
          - exp_labels:
              job: yang-system
              severity: warning
              slo: authorization_freshness
            exp_annotations:
              summary: "authorization propagation p99 exceeds two seconds"
              runbook: "docs/contracts/SLO.md"

  # 传播 p99 反例：桶计数累计 99/100（p99≈1s，低于 2 秒目标），不应触发。
  - interval: 1m
    input_series:
      - series: 'authz_propagation_seconds_bucket{job="yang-system", instance="127.0.0.1:9090", le="1"}'
        values: '0+99x24'
      - series: 'authz_propagation_seconds_bucket{job="yang-system", instance="127.0.0.1:9090", le="2.5"}'
        values: '0+100x24'
    alert_rule_test:
      - eval_time: 25m
        alertname: YangSystemAuthorizationPropagationP99High
        exp_alerts: []

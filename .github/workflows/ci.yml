name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"
  LIB_YANG_REF: master

jobs:
  quality:
    name: Rust, frontend and architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/yang-system
    steps:
      - name: Checkout lib_yang dependency
        uses: actions/checkout@v4
        with:
          repository: ImYangJiaJun/lib_yang
          ref: ${{ env.LIB_YANG_REF }}
          ssh-key: ${{ secrets.LIB_YANG_SSH_KEY }}
          persist-credentials: false
      - name: Checkout yang-system
        uses: actions/checkout@v4
        with:
          path: project/yang-system
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/yang-system -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: project/yang-system/frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Validate deployment Nginx configuration
        run: >-
          docker run --rm
          -v "${PWD}/frontend/deploy/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
          nginx -t
      - name: Validate Prometheus rules and alert drill
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/ops/prometheus:/rules:ro" -w /rules \
            prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3 \
            check rules yang-system.rules.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/ops/prometheus:/rules:ro" -w /rules \
            prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3 \
            test rules yang-system.rules.test.yml
      - name: Verify local CI contract
        run: python scripts/run_ci.py --self-test
      - name: Full quality gate
        run: python scripts/run_ci.py full

  msrv:
    name: MSRV 1.80
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/yang-system
    steps:
      - name: Checkout lib_yang dependency
        uses: actions/checkout@v4
        with:
          repository: ImYangJiaJun/lib_yang
          ref: ${{ env.LIB_YANG_REF }}
          ssh-key: ${{ secrets.LIB_YANG_SSH_KEY }}
          persist-credentials: false
      - name: Checkout yang-system
        uses: actions/checkout@v4
        with:
          path: project/yang-system
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.80
          workspaces: project/yang-system -> target
      - run: cargo check --all-targets --locked

  integration:
    name: Real MySQL 8 and Redis 7
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration
          MYSQL_DATABASE: yang_system_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pintegration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YANG_SYSTEM_TEST_DATABASE_URL: mysql://root:integration@127.0.0.1:3306/yang_system_test
      YANG_SYSTEM_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: project/yang-system
    steps:
      - name: Checkout lib_yang dependency
        uses: actions/checkout@v4
        with:
          repository: ImYangJiaJun/lib_yang
          ref: ${{ env.LIB_YANG_REF }}
          ssh-key: ${{ secrets.LIB_YANG_SSH_KEY }}
          persist-credentials: false
      - name: Checkout yang-system
        uses: actions/checkout@v4
        with:
          path: project/yang-system
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/yang-system -> target
      - run: python scripts/run_ci.py integration

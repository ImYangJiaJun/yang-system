<h1 style="margin:0 0 12px;font-size:25px;color:#0f1e36">飞书用户授权即将到期</h1><p style="color:#60708a">本系统的飞书用户身份（授权人：<strong>{{user_name}}</strong>）自最近一次完整授权起已满 <strong>{{days_since_authorized}}</strong> 天。</p><div style="padding:16px;background:#f3f6fa;border:1px solid #e3e9f1;border-radius:6px;color:#33475f;line-height:1.7">飞书规定：用户授权应用满 <strong>365 天</strong>后，必须由用户重新授权才能继续换取用户访问凭证。到期后，「发起人姓名 → open_id」的解析会失败，带发起人的审批派发将无法创建实例。</div><div style="margin-top:24px;padding:13px 15px;border-left:3px solid #ef8b34;background:#fff5ec;color:#705337;font-size:13px;line-height:1.7"><strong>请尽快重新授权：</strong><br>1. 登录 {{system_name}}；<br>2. 进入「飞书审批配置」页；<br>3. 点「去授权」，在飞书授权页完成确认。</div><p style="margin-top:20px;color:#60708a;font-size:13px">重新授权后本提醒会自动停止（计时从新的授权时间重新开始）。在你完成重新授权之前，本邮件每天发送一次。</p>

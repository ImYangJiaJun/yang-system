# YANG System SPA application edge.
# Bind this listener behind an HTTPS edge that overwrites forwarded headers.
# The public TLS endpoint must preserve these response headers.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $uri $yang_cache_control {
        default "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    map $http_x_forwarded_proto $yang_forwarded_proto {
        default $scheme;
        ~^(?:http|https)$ $http_x_forwarded_proto;
    }

    upstream yang_system_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 127.0.0.1:8081 default_server;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control $yang_cache_control always;

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ~ ^/(?:api|\.well-known|health)(?:/|$) {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $yang_forwarded_proto;
            proxy_pass http://yang_system_backend;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

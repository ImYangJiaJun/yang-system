# YANG System SPA application edge.
# Bind this listener behind an HTTPS edge that overwrites forwarded headers.
# The public TLS endpoint must preserve these response headers.
#
# 【2026-09-22：监听地址由 127.0.0.1:8081 改为 8081（所有网卡）】
#
# 原设计只绑 loopback，理由是「应用边缘必须躲在受信 TLS 边缘之后」。但容器编排用
# `docker -p` 发布端口时，DNAT 会把流量送到 netns 的 eth0，而 loopback 绑定收不到
# ——「只听 loopback」与「用 -p 发布端口」在技术上互斥。
#
# 现在把「不暴露公网」的责任交给编排层，规则是：
#   **发布端口必须写 `-p 127.0.0.1:<host_port>:8081`，绝不写 `-p <host_port>:8081`。**
# 受信 TLS 边缘仍必须在该宿主端口之前终止 HTTPS 并覆盖 Forwarded/X-Forwarded-*。
#
# 监听 80/443 仍被禁止，由 `frontend/scripts/verify-deployment-contract.mjs` 强制。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $uri $yang_cache_control {
        default "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    map $http_x_forwarded_proto $yang_forwarded_proto {
        default $scheme;
        ~^(?:http|https)$ $http_x_forwarded_proto;
    }

    upstream yang_system_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        # 所有网卡。对外暴露范围由编排层约束（`-p 127.0.0.1:<host_port>:8081`），
        # 见文件头说明。禁止监听 80/443。
        listen 8081 default_server;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control $yang_cache_control always;

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ~ ^/(?:api|\.well-known|health)(?:/|$) {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # ⚠️ 必须用 $http_host（保留端口），**不能**用 $host。
            #    nginx 的 $host 会剥掉端口（实测：Host: 1.2.3.4:8154 → $host=1.2.3.4，
            #    $http_host=1.2.3.4:8154），而后端 BrowserSession::validate_same_origin
            #    （crates/yang-base/src/action/auth/browser_session.rs）把 Origin/Referer 的
            #    **authority（含端口）** 与 Host 头做**全等比较**。应用一旦跑在非默认端口上
            #    （如 8154），$host 会让 `http://IP:8154` 的 Origin 与 `IP` 比对失败，
            #    所有带 Origin 的浏览器写请求（登录/注册/重置密码）一律 403。
            #    2026-09-23 实测踩过。改回 $host 会重新引入该故障。
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $yang_forwarded_proto;
            proxy_pass http://yang_system_backend;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
